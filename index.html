<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f5fd">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

<title>PolyMess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--listw:340px;--p:#4b3fd6;--p2:#4b3fd6;--acc:#ff6b57;--ink:#1d1a3b;--mut:#7d7aa0;--line:#ece9fa;--bg:#f6f5fd;--rail:#1f2347;--ok:#34b46c;--red:#e5484d;--card:#fff;--soft:#f1effc;--page:#e9e7f7;--hov:#faf9ff;--hov2:#f4f2fd;--sel:#f0edff;--pill:#ebe8fa;--line2:#f0eefb;--chk:#d3d0ee;--tabtx:#6b6890;--toast:#1d1a3b;color-scheme:light}
html[data-theme=dark]{color-scheme:dark;--p:#5b4ff0;--p2:#5b4ff0;--ink:#ecebff;--mut:#a9a7d0;--line:#2a2a50;--line2:#252548;--bg:#12122a;--card:#1c1c3a;--soft:#26264d;--page:#0d0d20;--hov:#20204a;--hov2:#232350;--sel:#26265a;--pill:#232348;--chk:#464c7a;--tabtx:#b3b0dc;--toast:#343a72}
::placeholder{color:var(--mut);opacity:.8}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:inherit;border:none;outline:none;background:none}
.hidden{display:none!important}

/* Auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:22px;box-shadow:0 30px 80px rgba(40,50,100,.18);padding:34px;width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4b3fd6,#7a6cff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:21px;flex:none}
.brand h1{font-size:26px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin-bottom:22px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input{width:100%;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input:focus{box-shadow:0 0 0 2px var(--p)}
.btn-p{width:100%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;padding:13px;border-radius:12px;margin-top:6px}
.btn-p:disabled{opacity:.6}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--mut)}
.switch button{color:var(--p);font-weight:700}
.msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:10px}
.msg.err{background:#ffeef0;color:#c9304a}.msg.ok{background:#e9f8f0;color:#1f8a52}

/* App */
#app{height:100%;display:grid;grid-template-columns:var(--listw) 1fr 300px;background:var(--card);overflow:hidden}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:14px}
.rail .logo{margin-bottom:8px;width:42px;height:42px;font-size:19px}
.ric{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a8aed6;font-size:20px;position:relative}
.ric.on{background:rgba(255,255,255,.14);color:#fff}
.ric .b{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.sp{flex:1}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{padding:22px 20px 10px}
.lh h2{font-size:23px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.plus{width:36px;height:36px;border-radius:12px;background:var(--p);color:#fff;font-size:22px;line-height:1}
.search{margin-top:14px;background:var(--soft);border-radius:12px;padding:11px 14px;width:100%;font-size:14px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--soft);color:var(--tabtx)}
.tab.on{background:var(--p);color:#fff}
.convs{flex:1;overflow-y:auto;padding-bottom:10px}
.conv{display:flex;gap:12px;padding:12px 20px;align-items:center;width:100%;text-align:left;border-left:3px solid transparent}
.conv:hover{background:var(--hov)}
.conv.on{background:var(--sel);border-left-color:var(--p)}
.av{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.cm{flex:1;min-width:0}
.cm .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.cm .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .t span{font-weight:500;font-size:12px;color:#9aa0bb;flex:none}
.cm .p{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:13.5px;color:var(--mut);align-items:center}
.cm .p i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--p);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;flex:none}
.empty{padding:30px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.chat{display:flex;flex-direction:column;background:var(--bg);min-height:0;min-width:0}
.ch{background:var(--card);padding:12px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.ch .n{font-weight:800;font-size:17px}.ch .s{font-size:13px;color:var(--mut);margin-top:2px}
.back{display:none;width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:18px}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:17px}
.msgs{flex:1;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:12px;font-weight:600;color:#8a90ad;background:var(--pill);padding:4px 12px;border-radius:12px;margin:10px 0 6px}
.m{max-width:min(68%,640px);padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m small{display:block;font-size:11px;margin-top:3px;opacity:.6;text-align:right;white-space:normal}
.m .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.in{background:var(--card);align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 1px 3px rgba(30,40,90,.07)}
.out{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.m.gap{margin-top:8px}
.comp{background:var(--card);margin:0 22px 18px;border-radius:18px;padding:8px 10px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 4px 18px rgba(30,40,90,.08)}
.comp textarea{flex:1;resize:none;max-height:120px;padding:10px 8px;font-size:15px;line-height:1.4}
.send{width:42px;height:42px;border-radius:14px;background:var(--p);color:#fff;font-size:18px;flex:none}
.send:disabled{opacity:.5}
.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:10px;text-align:center;padding:20px}
.blank .logo{width:64px;height:64px;font-size:30px;border-radius:20px}
.info{border-left:1px solid var(--line);padding:28px 22px;text-align:center;overflow-y:auto}
.info .av{width:88px;height:88px;font-size:32px;margin:0 auto 12px}
.info h3{font-size:19px;font-weight:800}.info p{font-size:13px;color:var(--mut);margin-top:4px}
.sec{text-align:left;margin-top:22px}
.sec h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0bb;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}
.row span{color:#8a90ad}
.mem{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.mem .av{width:32px;height:32px;font-size:12px;margin:0}
.logout{color:var(--red);font-weight:600}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;padding:22px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal .x{font-size:20px;color:var(--mut)}
.modal .res{overflow-y:auto;margin-top:10px;flex:1}
.pick{display:flex;gap:12px;align-items:center;padding:9px 6px;border-radius:12px;width:100%;text-align:left}
.pick:hover{background:var(--hov2)}
.pick .av{width:38px;height:38px;font-size:14px}
.pick small{color:var(--mut);display:block;font-size:12px}
.chk{margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--chk);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:none}
.chk.on{background:var(--p);border-color:var(--p)}
.mode{display:flex;gap:8px;margin-bottom:12px}


/* Mise à jour */
#upd{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(20,24,50,.35);display:flex;gap:14px;align-items:center;font-size:14px;z-index:99;max-width:calc(100vw - 24px)}
#upd button{background:var(--p);color:#fff;font-weight:700;padding:7px 14px;border-radius:10px;white-space:nowrap}

/* Avatar / menu / réglages */
.meav{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.meav.mob{display:none;width:36px;height:36px;font-size:13px;box-shadow:none}
.hbtns{display:flex;gap:10px;align-items:center}
#menu{position:fixed;z-index:60;background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(20,24,50,.28);padding:8px;min-width:236px;max-width:calc(100vw - 24px);left:86px;bottom:18px}
#menu .mh{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
#menu .mh b{display:block;font-size:15px}#menu .mh span{font-size:12.5px;color:var(--mut);word-break:break-all}
#menu button{display:flex;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-size:14.5px;text-align:left;align-items:center}
#menu button:hover{background:var(--hov2)}#menu .mo-out{color:var(--red)}
.modal.set{max-width:620px;height:min(640px,88vh);max-height:none}
.stabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;flex:none}.stabs .tab{white-space:nowrap}
.sbody{flex:1;overflow-y:auto;padding:2px 2px 6px}
.pvav{width:84px;height:84px;border-radius:50%;color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin:2px auto 16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%}.sw .sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--p)}
.sbtn{background:var(--p);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;margin-top:4px}
.sbtn.ghost{background:var(--soft);color:var(--ink)}.sbtn.danger{background:var(--red)}.sbtn:disabled{opacity:.6}
.h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0bb;margin:22px 0 8px;font-weight:700}
.hint2{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.4}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.sw2{width:46px;height:27px;border-radius:14px;background:var(--chk);position:relative;flex:none;transition:.15s}
.sw2:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
.sw2.on{background:var(--p)}.sw2.on:after{left:22px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-weight:600;font-size:14px}
.th i{display:block;width:44px;height:30px;border-radius:8px;margin:0 auto 8px;border:1px solid var(--line)}
.th.on{border-color:var(--p);background:var(--sel)}
.dz{margin-top:26px;padding:16px;border:1px solid #ffc9d0;border-radius:14px}
.dz p{font-size:13px;color:var(--mut);margin:6px 0 12px;line-height:1.45}
.sbody .msg{margin:10px 0}
/* Fiche du contact : masquable, en volet sur fenêtre moyenne */
#app.noinfo{grid-template-columns:var(--listw) 1fr}
#app.noinfo .info{display:none}
.ch .sp{flex:1}
#infoBtn{font-size:20px;color:var(--mut);font-weight:700}
#infoBtn:hover{color:var(--p)}
@media(max-width:1399px){
 :root{--listw:300px}
 #app{grid-template-columns:var(--listw) 1fr}
 .info{position:fixed;right:0;top:0;bottom:0;width:320px;max-width:calc(100vw - 20px);z-index:40;background:var(--card);box-shadow:-10px 0 40px rgba(20,24,50,.28)}
}
@media(max-width:1020px){:root{--listw:280px}}
/* Mobile */
@media(max-width:900px){
 #app,#app.noinfo{grid-template-columns:1fr;position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
 html,body{overflow:hidden;overscroll-behavior:none}
 input,textarea{font-size:16px!important}
 .rail{display:none}
 .info{display:none}
 #app.mobinfo .info{display:block;position:fixed;left:0;right:0;top:0;bottom:0;width:auto;max-width:none;z-index:45;box-shadow:none;padding-top:64px}
 #app.mobinfo .info .back{display:block;position:absolute;left:14px;top:14px}
 .ch .av,.ch .n{cursor:pointer}
 #chSub:after{content:' ›'}
 .list{border-right:none}
 #app.inchat .list{display:none}
 #app:not(.inchat) .chat{display:none}
 .back{display:block}
 .meav.mob{display:flex}
 #infoBtn{display:none}
 #menu{left:auto;right:12px;top:64px;bottom:auto}
 .two{grid-template-columns:1fr 1fr}
 .m{max-width:84%}
 .msgs{padding:14px 12px}
 .comp{margin:0 10px calc(10px + env(safe-area-inset-bottom))}
}

.av{position:relative}
.av.on::after{content:'';position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#2fbf71;border:2px solid var(--card)}
.ch .s.live{color:#1f9d5c}
.m{position:relative}.m:not(.del){cursor:pointer}
.m .q{display:block;border-left:3px solid currentColor;background:rgba(127,127,127,.16);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:12.5px;cursor:pointer;white-space:normal}
.m .q b{display:block;font-size:12px}.m .q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;opacity:.85}
.m.del{opacity:.65;font-style:italic}
.m .pj{display:block;max-width:100%;max-height:320px;min-width:140px;min-height:90px;border-radius:12px;margin-bottom:4px;object-fit:cover;background:rgba(127,127,127,.18)}
.m .file{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(127,127,127,.16);margin-bottom:4px;text-decoration:none;color:inherit;font-weight:600;white-space:normal}
.m .file small{display:block;margin:0;text-align:left;opacity:.7;font-weight:400}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rx{font-size:12.5px;padding:1px 7px;border-radius:12px;background:rgba(127,127,127,.2);border:1px solid transparent;color:inherit}
.rx.mine{border-color:var(--p);background:rgba(108,99,255,.2)}
.out .rx.mine{border-color:#fff}
.rd{color:#bff3ff;font-weight:700}
.hl{animation:hl 1.3s}@keyframes hl{0%,70%{box-shadow:0 0 0 3px var(--p)}100%{box-shadow:0 0 0 0 transparent}}
#mmenu{position:fixed;z-index:80;background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(20,25,60,.28);padding:6px;min-width:200px}
#mmenu .em{display:flex;gap:2px;padding:4px 4px 6px;border-bottom:1px solid var(--line2);margin-bottom:4px}
#mmenu .em button{font-size:22px;width:36px;height:36px;border-radius:10px}
#mmenu .em button.on,#mmenu .em button:hover,#mmenu .it:hover{background:var(--soft)}
#mmenu .it{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px}
#mmenu .it.red{color:#d93a55}
.bar{margin:0 22px 8px;display:flex;flex-direction:column;gap:6px}
.bar .bi{display:flex;align-items:center;gap:8px;background:var(--card);border-left:3px solid var(--p);border-radius:10px;padding:6px 10px;font-size:13px}
.bar .bi div{flex:1;min-width:0}.bar .bi b{display:block;font-size:12px;color:var(--p)}
.bar .bi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.bar .bi button{width:26px;height:26px;border-radius:8px;background:var(--soft)}
.clip{width:42px;height:42px;border-radius:14px;font-size:19px;flex:none}
#lb{position:fixed;inset:0;z-index:90;background:rgba(10,12,30,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#lb img{max-width:94vw;max-height:78vh;border-radius:8px}
#lb .lbb{display:flex;gap:10px}#lb .lbb button{background:#fff;color:#1c2033;padding:9px 16px;border-radius:12px;font-weight:700}
@media(max-width:900px){.bar{margin:0 10px 6px}}

/* ===== Design v2 ===== */
.rail{display:none}
.ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mini{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--mut)}
#auth{background:linear-gradient(160deg,#e9e7f7,#f6f5fd)}
html[data-theme=dark] #auth{background:linear-gradient(160deg,#12122a,#1c1c3a)}
.card{border-radius:24px;box-shadow:0 20px 60px rgba(40,30,120,.18)}
.brand .logo{width:56px;height:56px;font-size:26px;border-radius:17px}
.meav{box-shadow:none}.meav.mob{display:flex;width:40px;height:40px;font-size:14px}
.lh h2{gap:10px}.lh h2 .hlft{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.plus,.ibtn,.clip{display:flex;align-items:center;justify-content:center;color:var(--p);font-size:0}
.plus{background:var(--soft);border-radius:12px;width:38px;height:38px}
.ibtn{background:var(--soft);border-radius:12px;width:40px;height:40px}
.conv{width:calc(100% - 20px);margin:2px 10px;padding:12px;border-radius:16px;border-left:none;position:relative}
.conv.on::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--p)}
.cm .t span{display:flex;align-items:center}
.bd{background:var(--acc);font-size:12px;padding:2px 8px;border-radius:12px}
.av.on::after{background:var(--acc);border:2.5px solid var(--card)}
.conv.on .av.on::after{border-color:var(--sel)}
.ch{padding:14px 24px}.ch .s.live{color:var(--acc);font-weight:600}
.m{border-radius:20px;padding:11px 16px;font-size:15px;line-height:1.5}
.m small{font-size:12px;opacity:.7}
.in{border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(60,50,140,.07)}
.out{background:var(--p);border-bottom-right-radius:6px}
.m.gap{margin-top:10px}

 .tbar{display:flex;flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 0 calc(8px + env(safe-area-inset-bottom))}

 #menu{left:12px;right:12px;top:auto;bottom:calc(76px + env(safe-area-inset-bottom));max-width:none}

}

<body>

<!-- AUTH -->
<div id="auth" class="hidden">
 <form class="card" id="authForm" autocomplete="on">
  <div class="brand"><div class="logo">P</div><h1>PolyMess</h1></div>
  <p class="sub" id="authSub">Connecte-toi pour discuter.</p>
  <div id="signupOnly" class="hidden">
   <div class="two">
    <label class="fld"><span>Prénom</span><input id="fFirst" maxlength="40" autocomplete="given-name" placeholder="Julien"></label>
    <label class="fld"><span>Nom</span><input id="fLast" maxlength="40" autocomplete="family-name" placeholder="Lespes"></label>
   </div>
   <label class="fld"><span>Date de naissance</span><input id="fBirth" type="date" min="1900-01-01" autocomplete="bday"></label>
  </div>
  <label class="fld"><span>E-mail</span><input id="fMail" type="email" required autocomplete="email" placeholder="toi@exemple.fr"></label>
  <label class="fld"><span>Mot de passe</span><input id="fPass" type="password" required minlength="6" autocomplete="current-password" placeholder="6 caractères minimum"></label>
  <button class="btn-p" id="authBtn" type="submit">Se connecter</button>
  <div id="authMsg"></div>
  <div class="switch"><span id="swTxt">Pas encore de compte ?</span> <button type="button" id="swBtn">Créer un compte</button></div>
 </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
 <div class="rail">
  <div class="logo">P</div>
  <div class="ric on">💬<span class="b hidden" id="railBadge"></span></div>
  <div class="sp"></div>
  <button class="meav" id="meBtn" title="Mon compte"></button>
 </div>

 <div class="list">
  <div class="lh">
   <h2><span class="hlft"><button class="meav mob" id="meBtnM" title="Mon compte"></button>Messages</span><span class="hbtns"><button class="plus" id="newBtn" title="Nouvelle discussion" aria-label="Nouvelle discussion"><svg class="ico " viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></span></h2>
   <input class="search" id="q" placeholder="Rechercher une conversation…">
   <div class="tabs"><button class="tab on" data-f="all">Tous</button><button class="tab" data-f="unread">Non lus</button></div>
  </div>
  <div class="convs" id="convs"></div>
  <nav class="tbar"><button class="s" id="tbMsgs"><svg class="ico " viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.7 7L4 20l1-5A8 8 0 1121 12z"/></svg>Messages</button><button id="tbMe"><svg class="ico " viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Moi</button></nav>
 </div>

 <div class="chat" id="chat">
  <div class="blank" id="blank"><div class="logo">P</div><b style="color:var(--ink);font-size:18px">Bienvenue sur PolyMess</b><span>Choisis une conversation ou démarre-en une avec le bouton +</span></div>
  <div class="hidden" id="chatBox" style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div class="ch">
    <button class="back" id="backBtn">‹</button>
    <div class="av" id="chAv" style="width:42px;height:42px;font-size:15px"></div>
    <div id="chInfo"><div class="n" id="chName"></div><div class="s" id="chSub"></div></div>
    <span class="sp"></span><button class="ibtn" id="srchBtn" title="Rechercher dans la conversation" aria-label="Rechercher"><svg class="ico " viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button><button class="ibtn" id="infoBtn" title="Informations sur la conversation" aria-label="Informations" style="margin-left:8px"><svg class="ico " viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5"/></svg></button>
   </div>
   <div id="sbar" class="hidden"><input id="sq" placeholder="Rechercher dans la conversation…" autocomplete="off"><span id="scnt"></span><button class="ibtn" id="sPrev" aria-label="Plus ancien"><svg class="ico " viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><button class="ibtn" id="sNext" aria-label="Plus récent"><svg class="ico " viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="ibtn" id="sX" aria-label="Fermer"><svg class="ico " viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <div class="msgs" id="msgs"></div>
   <div class="bar hidden" id="bar"></div>
   <form class="comp" id="comp">
    <button type="button" class="clip" id="clipBtn" title="Joindre un fichier" aria-label="Joindre un fichier"><svg class="ico " viewBox="0 0 24 24"><path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.3 3.3 0 014.7 4.7L10 18.4a1.7 1.7 0 01-2.4-2.4L15 8.6"/></svg></button>
    <input type="file" id="file" class="hidden" accept="image/*,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,.pptx">
    <textarea id="txt" rows="1" placeholder="Écrire un message…" maxlength="4000"></textarea>
    <button class="send" id="sendBtn" type="submit" disabled aria-label="Envoyer"><svg class="ico " viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
   </form>
  </div>
 </div>

 <div class="info" id="info"></div>
</div>

<div id="menu" class="hidden"></div>
<div id="modalHost"></div>
<div id="upd" class="hidden"></div>

<script>
const SB_URL='https://qcogqpwjhtutxpyhrcld.supabase.co';
const SB_KEY='sb_publishable_XoDSg1mKCph5ruluOBHvBQ_gKIxXymt';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS={"search": "<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"M21 21l-4-4\"/>", "info": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8h.01M11 12h1v5\"/>", "clip": "<path d=\"M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.3 3.3 0 014.7 4.7L10 18.4a1.7 1.7 0 01-2.4-2.4L15 8.6\"/>", "send": "<path d=\"M5 12h14M13 6l6 6-6 6\"/>", "plus": "<path d=\"M12 5v14M5 12h14\"/>", "bell": "<path d=\"M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0\"/>", "bellOff": "<path d=\"M18 8a6 6 0 00-9.3-5M6 8c0 7-3 9-3 9h13M13.7 21a2 2 0 01-3.4 0M3 3l18 18\"/>", "star": "<path d=\"M12 17l-5 3 1.5-5.5L4 10.5l5.7-.3L12 5l2.3 5.2 5.7.3-4.5 4L17 20z\"/>", "reply": "<path d=\"M9 14L4 9l5-5M4 9h10a6 6 0 016 6v2\"/>", "copy": "<rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V6a2 2 0 012-2h9\"/>", "edit": "<path d=\"M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4\"/>", "trash": "<path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/>", "gear": "<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1\"/>", "out": "<path d=\"M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9\"/>", "chat": "<path d=\"M21 12a8 8 0 01-11.7 7L4 20l1-5A8 8 0 1121 12z\"/>", "user": "<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0116 0\"/>", "file": "<path d=\"M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5\"/>", "close": "<path d=\"M6 6l12 12M18 6L6 18\"/>", "up": "<path d=\"M6 15l6-6 6 6\"/>", "down": "<path d=\"M6 9l6 6 6-6\"/>"};
const ico=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const MCOLS='id,conversation_id,sender_id,content,created_at,reply_to,att_path,att_name,att_type,att_size,edited_at,deleted_at';
const S={email:'',me:null,convs:[],cur:null,msgs:{},filter:'all',q:'',chan:null,signup:false,sq:null,react:{},online:new Set(),reply:null,edit:null,att:null,urls:{},typing:null};
const COLORS=['#6c63ff','#e8618c','#4aa3f0','#34b46c','#f6b84b','#f0795b','#3cc4c4','#8a63e6'];
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const colorOf=(id,c)=>c||COLORS[[...String(id)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%COLORS.length];

/* ---------- AUTH ---------- */
function setAuthMode(signup){
  S.signup=signup;
  $('signupOnly').classList.toggle('hidden',!signup);
  $('authBtn').textContent=signup?'Créer mon compte':'Se connecter';
  $('authSub').textContent=signup?'Crée ton compte PolyMess.':'Connecte-toi pour discuter.';
  $('swTxt').textContent=signup?'Déjà un compte ?':'Pas encore de compte ?';
  $('swBtn').textContent=signup?'Se connecter':'Créer un compte';
  $('fPass').autocomplete=signup?'new-password':'current-password';
  $('authMsg').innerHTML='';
}
$('swBtn').onclick=()=>setAuthMode(!S.signup);
const authMsg=(t,k)=>$('authMsg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`;
$('authForm').onsubmit=async e=>{
  e.preventDefault();
  const email=$('fMail').value.trim(),password=$('fPass').value;
  $('authBtn').disabled=true;$('authMsg').innerHTML='';
  try{
    if(S.signup){
      const first_name=$('fFirst').value.trim(),last_name=$('fLast').value.trim(),birth_date=$('fBirth').value;
      if(!first_name){authMsg('Indique ton prénom.','err');return}
      if(!last_name){authMsg('Indique ton nom.','err');return}
      const bd=new Date(birth_date+'T00:00:00');
      if(!birth_date||isNaN(bd)||bd>new Date()||bd<new Date('1900-01-01T00:00:00')){authMsg('Indique une date de naissance valide.','err');return}
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name,last_name,birth_date}}});
      if(error){authMsg(/already registered/i.test(error.message)?'Cette adresse e-mail est déjà utilisée.':error.message,'err');return}
      if(!data.session){authMsg('Compte créé. Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.','ok');setAuthMode(false)}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)authMsg(error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message,'err');
    }
  }finally{$('authBtn').disabled=false}
};
async function logout(){
  try{await pushDetach()}catch(e){}
  stopPresence();
  if(S.chan){sb.removeChannel(S.chan);S.chan=null}
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(session?.user){ if(S.me?.id!==session.user.id) setTimeout(()=>boot(session.user),0) }
  else{ S.me=null;S.convs=[];S.cur=null;S.msgs={};$('app').classList.add('hidden');$('auth').classList.remove('hidden') }
});

/* ---------- BOOT ---------- */
async function boot(user){
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!prof){authMsg('Profil introuvable : '+(error?.message||''),'err');return}
  S.me=prof;S.email=user.email||'';renderMe();
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  await loadConvs();
  subscribe();
  startPresence();
  renderAll();
  if(prefs.push&&pushSupported()&&Notification.permission==='granted')pushSubscribe().catch(()=>{});
  const wanted=new URLSearchParams(location.search).get('c');
  if(wanted&&S.convs.some(c=>c.id===wanted)){openConv(wanted);if(new URLSearchParams(location.search).get('reply'))setTimeout(()=>txt.focus(),400)}
  if(location.search)history.replaceState(history.state,'',location.pathname);
}

async function loadConvs(){
  const {data:mine,error}=await sb.from('conversation_members').select('conversation_id,last_read_at,muted,pinned,conversations(id,created_at)').eq('user_id',S.me.id);
  if(error){console.error(error);return}
  const ids=mine.map(m=>m.conversation_id);
  if(!ids.length){S.convs=[];return}
  const [{data:mem},{data:recent}]=await Promise.all([
    sb.from('conversation_members').select('conversation_id,user_id,last_read_at,profiles(id,username,display_name,first_name,last_name,color,last_seen_at)').in('conversation_id',ids),
    sb.from('messages').select(MCOLS).in('conversation_id',ids).order('created_at',{ascending:false}).limit(400)
  ]);
  const byConv={},readAt={};
  (mem||[]).forEach(m=>{if(m.profiles)(byConv[m.conversation_id]??=[]).push(m.profiles);readAt[m.conversation_id+m.user_id]=m.last_read_at});
  const lastBy={};
  (recent||[]).forEach(m=>{(lastBy[m.conversation_id]??=[]).push(m)});
  S.convs=mine.map(m=>{
    const c=m.conversations,members=byConv[c.id]||[];
    const other=members.find(p=>p.id!==S.me.id);
    const msgs=(lastBy[c.id]||[]);
    const unread=msgs.filter(x=>x.sender_id!==S.me.id&&x.created_at>m.last_read_at).length;
    return {id:c.id,name:other?.display_name||'Utilisateur supprimé',color:colorOf(c.id,other?.color),other,members,last:msgs[0]||null,unread,created_at:c.created_at,last_read_at:m.last_read_at,muted:!!m.muted,pinned:!!m.pinned,other_read:other?readAt[c.id+other.id]:null};
  });
  sortConvs();
}
const sortConvs=()=>S.convs.sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.last?.created_at||b.created_at).localeCompare(a.last?.created_at||a.created_at));

/* ---------- REALTIME ---------- */
function subscribe(){
  if(S.chan)sb.removeChannel(S.chan);
  S.chan=sb.channel('polymess')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>onNewMsg(p.new))
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>onMsgUpdate(p.new))
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},p=>onReaction(p))
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members'},p=>onMemberUpdate(p.new))
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'conversation_members',filter:'user_id=eq.'+S.me.id},async()=>{await loadConvs();renderAll()})
   .subscribe();
}
const attLabel=m=>m.att_path?((m.att_type||'').startsWith('image/')?'📷 Photo':'📎 '+(m.att_name||'Fichier')):'';
const prevText=m=>m.deleted_at?'Message supprimé':(attLabel(m)+(attLabel(m)&&m.content?' ':'')+(m.content||''));
async function onNewMsg(m){
  let c=S.convs.find(x=>x.id===m.conversation_id);
  if(!c){await loadConvs();c=S.convs.find(x=>x.id===m.conversation_id);if(!c){renderAll();return}}
  c.last=m;
  if(m.sender_id!==S.me.id){
    if(!c.muted&&prefs.sound&&(document.hidden||S.cur!==c.id))beep();
    if(!c.muted&&prefs.notif&&!prefs.push&&document.hidden&&'Notification' in window&&Notification.permission==='granted')
      showNotif(c.name,prevText(m).slice(0,140),c.id);
    clearTyping(c.id);
  }
  if(S.msgs[c.id]&&!S.msgs[c.id].some(x=>x.id===m.id))S.msgs[c.id].push(m);
  if(S.cur===c.id){
    if(m.sender_id!==S.me.id){if(document.hidden)c.unread++;else markRead(c.id)}
    renderMsgs(true)
  }else if(m.sender_id!==S.me.id)c.unread++;
  sortConvs();renderList();
}
async function markRead(cid){
  const c=S.convs.find(x=>x.id===cid);if(c){c.unread=0;renderList()}
  const {data}=await sb.rpc('mark_read',{cid});
  if(c&&data)c.last_read_at=data;
}
function onMsgUpdate(m){
  const c=S.convs.find(x=>x.id===m.conversation_id);if(!c)return;
  const arr=S.msgs[c.id];if(arr){const i=arr.findIndex(x=>x.id===m.id);if(i>=0)arr[i]=m}
  if(c.last&&c.last.id===m.id)c.last=m;
  if(m.deleted_at)S.react[c.id]=(S.react[c.id]||[]).filter(r=>r.message_id!==m.id);
  if(S.cur===c.id)renderMsgs(false);
  renderList();
}
function setReact(cid,mid,uid,emoji){
  const l=(S.react[cid]||[]).filter(r=>!(r.message_id===mid&&r.user_id===uid));
  if(emoji)l.push({message_id:mid,user_id:uid,emoji});
  S.react[cid]=l;
}
function onReaction(p){
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.message_id)return;
  if(p.eventType==='DELETE'){
    for(const k in S.react)S.react[k]=S.react[k].filter(x=>!(x.message_id===r.message_id&&x.user_id===r.user_id));
    if(S.cur)renderMsgs(false);return;
  }
  if(!r.conversation_id)return;
  setReact(r.conversation_id,r.message_id,r.user_id,r.emoji);
  if(S.cur===r.conversation_id)renderMsgs(false);
}
function onMemberUpdate(r){
  const c=S.convs.find(x=>x.id===r.conversation_id);if(!c)return;
  if(r.user_id===S.me.id){if(c.muted!==!!r.muted||c.pinned!==!!r.pinned){c.muted=!!r.muted;c.pinned=!!r.pinned;sortConvs();renderList();if(S.cur===c.id)renderInfo(c)}return}
  c.other_read=r.last_read_at;if(S.cur===c.id)renderMsgs(false);
}
async function loadReactions(id){
  const {data}=await sb.from('reactions').select('message_id,user_id,emoji,conversation_id').eq('conversation_id',id);
  if(data)S.react[id]=data;
}

/* ---------- RENDER ---------- */
const fmtTime=d=>new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function fmtList(d){
  const x=new Date(d),n=new Date(),ds=(a,b)=>a.toDateString()===b.toDateString();
  if(ds(x,n))return fmtTime(d);
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(ds(x,y))return 'Hier';
  if(n-x<6*864e5)return x.toLocaleDateString('fr-FR',{weekday:'short'});
  return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}
function fmtDay(d){
  const x=new Date(d),n=new Date();
  if(x.toDateString()===n.toDateString())return 'Aujourd’hui';
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(x.toDateString()===y.toDateString())return 'Hier';
  return x.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

function renderList(){
  let list=S.convs.filter(c=>{
    if(S.filter==='unread'&&!c.unread)return false;
    if(S.q&&!c.name.toLowerCase().includes(S.q))return false;
    return true;
  });
  const tot=S.convs.reduce((a,c)=>a+c.unread,0);
  const rb=$('railBadge');rb.textContent=tot;rb.classList.toggle('hidden',!tot);
  document.title=(tot?`(${tot}) `:'')+'PolyMess';
  try{if(navigator.setAppBadge){tot?navigator.setAppBadge(tot):navigator.clearAppBadge()}}catch(e){}
  if(!list.length){
    $('convs').innerHTML=`<div class="empty">${S.convs.length?'Aucune conversation ne correspond.':'Aucune conversation pour l’instant.<br>Appuie sur <b>+</b> pour écrire à quelqu’un.'}</div>`;return;

  $('convs').innerHTML=list.map(c=>{
    const prev=c.last?((c.last.sender_id===S.me.id?'Toi : ':'')+prevText(c.last)):'Nouvelle conversation';
    return `<button class="conv ${c.id===S.cur?'on':''}" data-id="${esc(c.id)}">

      <div class="cm"><div class="t"><b>${esc(c.name)}</b><span>${c.pinned?ico('star','mini'):''}${c.muted?ico('bellOff','mini'):''}${c.last?fmtList(c.last.created_at):''}</span></div>

  }).join('');

async function openConv(id){
  if(S.cur!==id){if(S.sq){S.sq=null;$('sbar').classList.add('hidden')}S.reply=null;S.att=null;if(S.edit){S.edit=null;txt.value=''}}
  if(innerWidth<=900&&!$('app').classList.contains('inchat'))pushPM('chat');
  S.cur=id;$('app').classList.add('inchat');
  renderAll();
  if(!S.msgs[id]){
    const {data,error}=await sb.from('messages').select(MCOLS).eq('conversation_id',id).order('created_at',{ascending:false}).limit(200);
    if(error){console.error(error);return}
    S.msgs[id]=data.reverse();
  }
  await loadReactions(id);
  joinTyping(id);
  if(S.cur!==id)return;
  renderMsgs(true);
  const c=S.convs.find(x=>x.id===id);if(c&&c.unread)markRead(id);
  if(window.innerWidth>900)$('txt').focus();
}

const fmtSize=n=>!n?'':n<1024*1024?Math.max(1,Math.round(n/1024))+' Ko':(n/1048576).toFixed(1).replace('.',',')+' Mo';

function cachedUrl(p){const e=S.urls[p];return e&&e.exp>Date.now()?e.url:null}
async function signedUrl(p,dl){
  if(!dl){const c=cachedUrl(p);if(c)return c}
  const {data,error}=await sb.storage.from('attachments').createSignedUrl(p,3600,dl?{download:dl}:undefined);
  if(error||!data)return null;
  if(!dl)S.urls[p]={url:data.signedUrl,exp:Date.now()+3000*1000};
  return data.signedUrl;
}
function hydrateImgs(){
  document.querySelectorAll('img.pj:not([src]),img.th:not([src])').forEach(async im=>{const u=await signedUrl(im.dataset.path);if(u)im.src=u});
}
function renderMsgs(scroll){
  const c=S.convs.find(x=>x.id===S.cur);if(!c)return;
  const list=S.msgs[c.id]||[],el=$('msgs');
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<120;
  const byId=new Map(list.map(m=>[m.id,m]));
  const rx={};(S.react[c.id]||[]).forEach(r=>{(rx[r.message_id]??=[]).push(r)});
  let html='',lastDay='',lastSender='';
  const hs=S.sq?new Set(S.sq.ids):null;
  for(let i=0;i<list.length;i++){
    const m=list[i];
    const day=new Date(m.created_at).toDateString();
    if(day!==lastDay){html+=`<div class="day">${esc(fmtDay(m.created_at))}</div>`;lastDay=day;lastSender=''}
    const nx=list[i+1],cont=nx&&nx.sender_id===m.sender_id&&!nx.deleted_at&&new Date(nx.created_at).toDateString()===day&&(new Date(nx.created_at)-new Date(m.created_at))<300000;
    const mine=m.sender_id===S.me.id,gap=(lastSender!==m.sender_id?'gap':'')+(cont?' cont':'')+(hs&&hs.has(m.id)?' hit'+(S.sq.ids[S.sq.i]===m.id?' cur':''):'');
    lastSender=m.sender_id;
    if(m.deleted_at){html+=`<div class="m del ${mine?'out':'in'} ${gap}" data-id="${esc(m.id)}">Message supprimé<small>${fmtTime(m.created_at)}</small></div>`;continue}
    let q='';
    if(m.reply_to){const o=byId.get(m.reply_to);q=`<div class="q" data-go="${esc(m.reply_to)}"><b>${esc(o?(o.sender_id===S.me.id?'Toi':c.name):'Message')}</b><span>${esc(o?prevText(o):'Message d’origine indisponible')}</span></div>`}
    let att='';
    if(m.att_path){
      if((m.att_type||'').startsWith('image/')){const u=m.localUrl||cachedUrl(m.att_path);att=`<img class="pj" alt="${esc(m.att_name||'image')}" data-path="${esc(m.att_path)}"${u?` src="${esc(u)}"`:''}>`}
      else att=`<a class="file" href="#" data-path="${esc(m.att_path)}" data-name="${esc(m.att_name||'fichier')}">${ico('file')}<span>${esc(m.att_name||'Fichier')}<small>${fmtSize(m.att_size)}</small></span></a>`;
    }
    const rs=rx[m.id]||[];let rh='';
    if(rs.length){const g={};rs.forEach(r=>{(g[r.emoji]??=[]).push(r.user_id)});
      rh=`<div class="rxs">${Object.entries(g).map(([e,u])=>`<button class="rx ${u.includes(S.me.id)?'mine':''}" data-e="${e}" data-id="${esc(m.id)}">${e}${u.length>1?' '+u.length:''}</button>`).join('')}</div>`}
    const tick=mine?(m.pending?' …':(isRead(c,m)?' <b class="rd">✓✓</b>':' ✓')):'';
    html+=`<div class="m ${mine?'out':'in'} ${gap}" data-id="${esc(m.id)}">${q}${att}${m.content?esc(m.content):''}${rh}<small>${m.edited_at?'modifié · ':''}${fmtTime(m.created_at)}${tick}</small></div>`;
  }
  el.innerHTML=html||`<div class="empty">Dis bonjour 👋</div>`;
  if(c._mc!==undefined&&(list.filter(x=>x.att_path&&x.att_path!=='local'&&!x.deleted_at).length!==c._mc))renderInfo(c);
  stick=near||scroll===true;
  if(scroll&&(near||scroll===true))el.scrollTop=el.scrollHeight;
  hydrateImgs();
}

async function delMsg(m){

  const {error}=await sb.rpc('delete_message',{mid:m.id});
  if(error){alert('Suppression impossible : '+error.message);return}
  if(m.att_path)sb.storage.from('attachments').remove([m.att_path]);
  onMsgUpdate({...m,content:'',deleted_at:new Date().toISOString(),att_path:null,att_name:null,att_type:null,att_size:null,reply_to:null});
}
function openLightbox(path,name,src){

/* ---------- PIÈCES JOINTES ---------- */
const OKT=/^(image\/(jpeg|png|gif|webp|heic)|application\/pdf|text\/plain|application\/zip|application\/msword|application\/vnd\.(ms-excel|openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)))$/;
$('clipBtn').onclick=()=>{if(!S.edit)$('file').click()};
async function shrink(f){
  const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bm,0,0,cv.width,cv.height);
  return await new Promise((ok,ko)=>cv.toBlob(b=>b?ok(b):ko(new Error('blob')),'image/jpeg',.85));
}
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!OKT.test(f.type)){alert('Type de fichier non pris en charge (images, PDF, Word, Excel, PowerPoint, texte, zip).');return}
  let blob=f,type=f.type,name=f.name;const isImg=type.startsWith('image/');
  if(isImg&&type!=='image/gif'){
    try{const r=await shrink(f);if(r.size<f.size||type==='image/heic'){blob=r;type='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg'}}catch(err){}
  }
  if(blob.size>10*1024*1024){alert('Fichier trop lourd (10 Mo maximum).');return}
  S.att={blob,type,name,isImg};renderBar();
};

/* ---------- ENVOI ---------- */
const txt=$('txt');
const fit=()=>{txt.style.height='auto';txt.style.height=Math.min(txt.scrollHeight,120)+'px';$('sendBtn').disabled=!txt.value.trim()&&!S.att};
let lastTypeSent=0;
txt.oninput=()=>{fit();if(tReady&&tch&&txt.value&&!S.edit&&Date.now()-lastTypeSent>2500){lastTypeSent=Date.now();tch.send({type:'broadcast',event:'typing',payload:{uid:S.me.id}})}};
txt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>900){e.preventDefault();$('comp').requestSubmit()}};
async function doEdit(content){
  const id=S.edit.id,m=(S.msgs[S.cur]||[]).find(x=>x.id===id);
  if(!content)return;
  S.edit=null;txt.value='';renderBar();
  if(!m||m.content===content)return;
  const old=m.content,oldE=m.edited_at;m.content=content;m.edited_at=new Date().toISOString();
  renderMsgs(false);
  const {error}=await sb.rpc('edit_message',{mid:id,new_content:content});
  if(error){m.content=old;m.edited_at=oldE;renderMsgs(false);alert('Modification impossible : '+error.message)}
}
$('comp').onsubmit=async e=>{
  e.preventDefault();
  const content=txt.value.trim();
  if(S.edit){await doEdit(content);return}
  if((!content&&!S.att)||!S.cur)return;
  const cid=S.cur,reply=S.reply,att=S.att;
  txt.value='';S.reply=null;S.att=null;renderBar();
  const tmp={id:'tmp-'+Date.now(),conversation_id:cid,sender_id:S.me.id,content,created_at:new Date().toISOString(),pending:true,reply_to:reply?reply.id:null};
  if(att)Object.assign(tmp,{att_path:'local',att_name:att.name,att_type:att.type,att_size:att.blob.size,localUrl:att.isImg?URL.createObjectURL(att.blob):null});
  (S.msgs[cid]??=[]).push(tmp);renderMsgs(true);
  const arr=S.msgs[cid];
  const fail=msg=>{const i=arr.findIndex(x=>x.id===tmp.id);if(i>=0)arr.splice(i,1);renderMsgs(true);txt.value=content;S.reply=reply;S.att=att;renderBar();alert('Envoi impossible : '+msg)};
  const row={conversation_id:cid,sender_id:S.me.id,content,reply_to:reply?reply.id:null};
  if(att){
    const safe=att.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
    const path=`${cid}/${crypto.randomUUID()}-${safe}`;
    const up=await sb.storage.from('attachments').upload(path,att.blob,{contentType:att.type,upsert:false});
    if(up.error){fail(up.error.message);return}
    Object.assign(row,{att_path:path,att_name:att.name.slice(0,200),att_type:att.type,att_size:att.blob.size});
  }
  const {data,error}=await sb.from('messages').insert(row).select(MCOLS).single();
  if(error){if(row.att_path)sb.storage.from('attachments').remove([row.att_path]);fail(error.message);return}
  const i=arr.findIndex(x=>x.id===tmp.id);
  if(arr.some(x=>x.id===data.id)){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=data;
  if(tmp.localUrl&&data.att_path)S.urls[data.att_path]={url:tmp.localUrl,exp:Date.now()+3000*1000};
  const c=S.convs.find(x=>x.id===cid);if(c){c.last=data;sortConvs()}
  renderMsgs(true);renderList();
};

let tch=null,tchId=null,tReady=false;const typingT={};
function joinTyping(id){
  if(tchId===id&&tch)return;
  if(tch){sb.removeChannel(tch);tch=null}
  tchId=id;tReady=false;
  tch=sb.channel('typing:'+id,{config:{broadcast:{self:false}}})
   .on('broadcast',{event:'typing'},({payload})=>{
     if(!payload||payload.uid===S.me.id)return;
     clearTimeout(typingT[id]);S.typing=id;typingT[id]=setTimeout(()=>clearTyping(id),4000);updateSub();
   })
   .subscribe(st=>{tReady=st==='SUBSCRIBED'});
}
function clearTyping(id){clearTimeout(typingT[id]);if(S.typing===id){S.typing=null;updateSub()}}
const statusOn=()=>prefs.presence!==false;
function fmtSeen(d){
  const x=new Date(d),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(x.toDateString()===n.toDateString())return 'Vu à '+fmtTime(d);
  if(x.toDateString()===y.toDateString())return 'Vu hier à '+fmtTime(d);
  return 'Vu le '+x.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function updateSub(){
  const c=S.convs.find(x=>x.id===S.cur);if(!c)return;
  const on=statusOn()&&c.other&&S.online.has(c.other.id),t=subText(c);
  $('chSub').textContent=t||'Discussion privée';
  $('chSub').classList.toggle('live',t==='En ligne'||t==='écrit…');
  $('chAv').classList.toggle('on',!!on);
  const e=$('infoSt');if(e)e.textContent=subText(c,false)||'Discussion privée';
  const a=$('infoAv');if(a)a.classList.toggle('on',!!on);
}
let pch=null,seenTimer=null;
const touchSeen=()=>sb.rpc('touch_seen',{visible:true});
function stopPresence(){clearInterval(seenTimer);if(pch){sb.removeChannel(pch);pch=null}S.online=new Set()}
function startPresence(){
  stopPresence();
  if(!S.me)return;
  if(!statusOn()){sb.rpc('touch_seen',{visible:false});return}
  pch=sb.channel('presence',{config:{presence:{key:S.me.id}}});
  pch.on('presence',{event:'sync'},()=>{S.online=new Set(Object.keys(pch.presenceState()));updateSub();renderList()})
     .on('presence',{event:'leave'},({key})=>{for(const c of S.convs)if(c.other?.id===key)c.other.last_seen_at=new Date().toISOString();updateSub()})
     .subscribe(async st=>{if(st==='SUBSCRIBED'&&!document.hidden)await pch.track({at:Date.now()})});
  touchSeen();seenTimer=setInterval(()=>{if(!document.hidden)touchSeen()},60000);
}

/* ---------- MISE À JOUR AUTOMATIQUE ---------- */
const APP_VERSION='2026-11-07.14';
let updShown=false;
async function checkUpdate(manual){
  if(location.protocol==='file:')return 'local';
  if(updShown)return 'new';
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return 'err';
    const {v}=await r.json();
    if(!v||v===APP_VERSION)return 'ok';
    let tried=null;try{tried=sessionStorage.getItem('pm_upd')}catch(e){}
    const go=()=>{try{sessionStorage.setItem('pm_upd',v)}catch(e){}location.replace(location.pathname+'?v='+encodeURIComponent(v))};
    updShown=true;
    if(manual){go();return 'new'}
    // Pas de brouillon en cours et pas déjà tenté : mise à jour automatique
    if(!$('txt').value.trim()&&tried!==v){$('upd').innerHTML='Mise à jour de PolyMess…';$('upd').classList.remove('hidden');setTimeout(go,1200);return 'new'}
    $('upd').innerHTML='<span>Nouvelle version disponible</span><button id="updBtn">Mettre à jour</button>';
    $('upd').classList.remove('hidden');$('updBtn').onclick=go;
    return 'new';
  }catch(e){return 'err'}
}
setInterval(checkUpdate,5*60*1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){checkUpdate();refreshAll();if(pch)pch.track({at:Date.now()});if(S.cur){const c=S.convs.find(x=>x.id===S.cur);if(c&&c.unread)markRead(c.id)}}
  else if(S.me&&statusOn()){if(pch)pch.untrack();touchSeen()}
});
addEventListener('online',refreshAll);
addEventListener('pageshow',e=>{if(e.persisted)refreshAll()});
setTimeout(checkUpdate,3000);

let actx=null;
function beep(){try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1175,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.26);
}catch(e){}}

    theme(b){

      b.innerHTML=`<div class="themes">${opts.map(([k,l,bg])=>`<button type="button" class="th ${prefs.theme===k?'on':''}" data-k="${k}"><i style="background:${bg}"></i>${l}</button>`).join('')}</div>
       <div class="hint2" style="margin-top:12px">« Automatique » suit le réglage clair ou sombre de ton appareil.</div>`;
      b.querySelectorAll('.th').forEach(x=>x.onclick=()=>{prefs.theme=x.dataset.k;savePrefs();applyTheme();views.theme(b)});
    },
    about(b){
      b.innerHTML=`<div style="text-align:center;padding:14px 0 18px"><div class="logo" style="margin:0 auto 10px">P</div><b style="font-size:20px">PolyMess</b><div class="hint2">Version ${esc(APP_VERSION)}</div></div>
       <button class="sbtn ghost" id="aChk" style="width:100%">Vérifier les mises à jour</button><div id="am"></div>
       <div class="h5">Installer l’application</div>
       ${isStandalone()?'<div class="hint2">PolyMess est déjà installée sur cet appareil.</div>':installEv?'<button class="sbtn ghost" id="aInst" style="width:100%">Installer PolyMess</button>':isIOS()?'<div class="hint2">Sur iPhone : touche le bouton Partager de Safari, puis « Sur l’écran d’accueil ».</div>':'<div class="hint2">Dans ton navigateur, utilise « Installer l’application » (menu ⋮ ou icône dans la barre d’adresse).</div>'}`;
      const ib=$('aInst');if(ib)ib.onclick=async()=>{installEv.prompt();try{await installEv.userChoice}catch(e){}installEv=null;views.about(b)};
      $('aChk').onclick=async()=>{
        $('aChk').disabled=true;note('am','Vérification…','ok');
        const r=await checkUpdate(true);
        $('aChk').disabled=false;
        if(r==='ok')note('am','Tu as la dernière version.','ok');
        else if(r==='new')note('am','Nouvelle version trouvée, mise à jour…','ok');
        else if(r==='local')note('am','Vérification indisponible quand le fichier est ouvert en local.','err');
        else note('am','Impossible de vérifier : vérifie ta connexion.','err');
      };
    }
  };
  const shell=()=>{
    host.innerHTML=`<div class="ov" id="ov"><div class="modal set"><h3>Réglages <button class="x" id="mx">✕</button></h3><div class="stabs">${tabs.map(([k,l])=>`<button class="tab ${k===cur?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div class="sbody" id="sbody"></div></div></div>`;
    $('mx').onclick=close;$('ov').onclick=e=>{if(e.target.id==='ov')close()};
    host.querySelectorAll('.stabs .tab').forEach(x=>x.onclick=()=>{cur=x.dataset.t;shell()});
    views[cur]($('sbody'));
  };
  shell();
}


/* ---------- MOBILE : navigation, clavier, rafraîchissement, installation ---------- */
let curPM=null;
function pushPM(k){if(innerWidth<=900){history.pushState({pm:k},'');curPM=k}}
function hideMobInfo(){$('app').classList.remove('mobinfo')}
function closeChat(){S.cur=null;$('app').classList.remove('inchat');hideMobInfo();renderAll()}
function showMobInfo(){
  if(innerWidth>900||!S.cur)return;
  renderInfo(S.convs.find(x=>x.id===S.cur));
  $('app').classList.add('mobinfo');pushPM('info');
}
['chAv','chInfo'].forEach(id=>$(id).onclick=showMobInfo);
addEventListener('popstate',()=>{
  const st=history.state?.pm||null,was=curPM;curPM=st;
  // un volet ouvert (menu, réglages…) : le retour le ferme et on reste où on était
  if($('modalHost').firstChild||!$('menu').classList.contains('hidden')){
    $('modalHost').innerHTML='';$('menu').classList.add('hidden');
    if(was){history.pushState({pm:was},'');curPM=was}
    return;
  }
  if(st==='info')return;
  hideMobInfo();
  if(st!=='chat'&&S.cur&&$('app').classList.contains('inchat'))closeChat();
});

// clavier : l'appli suit la zone réellement visible (iPhone notamment)
function fitVV(){
  const v=window.visualViewport;if(!v)return;
  const st=document.documentElement.style;
  st.setProperty('--vvh',v.height+'px');st.setProperty('--vvt',v.offsetTop+'px');
  if(document.activeElement===$('txt')&&S.cur){const m=$('msgs');m.scrollTop=m.scrollHeight}
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitVV);visualViewport.addEventListener('scroll',fitVV);fitVV()}

// messages manqués : on recharge tout au retour dans l'appli
let lastRef=0;
async function refreshAll(){
  if(!S.me||Date.now()-lastRef<4000)return;
  lastRef=Date.now();
  try{
    await loadConvs();
    if(S.cur){
      const {data}=await sb.from('messages').select(MCOLS).eq('conversation_id',S.cur).order('created_at',{ascending:false}).limit(200);
      if(data)S.msgs[S.cur]=data.reverse();
      await loadReactions(S.cur);
      const c=S.convs.find(x=>x.id===S.cur);if(c&&c.unread&&!document.hidden)markRead(S.cur);
    }
    renderAll();
    if(S.chan&&S.chan.state!=='joined'&&S.chan.state!=='joining')subscribe();
  }catch(e){}
}

// notifications : via le service worker quand c'est possible
async function showNotif(title,body,tag){
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon-192.png?v=2',badge:'badge-96.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png?v=2'})}catch(e){}
}

// Web Push : abonner / désabonner cet appareil
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol.startsWith('http');
const urlB64=s=>{const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushSubscribe(){
  const reg=await navigator.serviceWorker.ready;
  const res=await fetch(SB_URL+'/functions/v1/push',{headers:{apikey:SB_KEY}});
  if(!res.ok)throw new Error('serveur injoignable');
  const {key}=await res.json();
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(key)});
  const j=sub.toJSON();
  const {error}=await sb.rpc('register_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent});
  if(error)throw error;
}
async function pushUnsubscribe(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager.getSubscription();
    if(sub){await sb.rpc('unregister_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}
  }catch(e){}
}
// à la déconnexion : l'appareil ne reçoit plus les messages de ce compte
async function pushDetach(){
  if(!pushSupported())return;
  const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager.getSubscription();
  if(sub)await sb.rpc('unregister_push',{p_endpoint:sub.endpoint});
}
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data&&e.data.type==='open'&&e.data.id){openConv(e.data.id);if(e.data.focus)setTimeout(()=>txt.focus(),300)}});

// installation sur l'écran d'accueil
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});
addEventListener('appinstalled',()=>{installEv=null});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- INIT ---------- */
(async()=>{
  setAuthMode(false);
  const {data:{session}}=await sb.auth.getSession();
  if(!session)$('auth').classList.remove('hidden');
})();
