<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--listw:340px;--p:#4b3fd6;--p2:#4b3fd6;--acc:#ff6b57;--ink:#1d1a3b;--mut:#7d7aa0;--line:#ece9fa;--bg:#f6f5fd;--rail:#1f2347;--ok:#34b46c;--red:#e5484d;--card:#fff;--soft:#f1effc;--page:#e9e7f7;--hov:#faf9ff;--hov2:#f4f2fd;--sel:#f0edff;--pill:#ebe8fa;--line2:#f0eefb;--chk:#d3d0ee;--tabtx:#6b6890;--toast:#1d1a3b;color-scheme:light}
html[data-theme=dark]{color-scheme:dark;--p:#5b4ff0;--p2:#5b4ff0;--ink:#ecebff;--mut:#a9a7d0;--line:#2a2a50;--line2:#252548;--bg:#12122a;--card:#1c1c3a;--soft:#26264d;--page:#0d0d20;--hov:#20204a;--hov2:#232350;--sel:#26265a;--pill:#232348;--chk:#464c7a;--tabtx:#b3b0dc;--toast:#343a72}
::placeholder{color:var(--mut);opacity:.8}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit;color:inherit;border:none;outline:none;background:none}
.hidden{display:none!important}

/* Auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:22px;box-shadow:0 30px 80px rgba(40,50,100,.18);padding:34px;width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4b3fd6,#7a6cff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:21px;flex:none}
.brand h1{font-size:26px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin-bottom:22px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input{width:100%;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input:focus{box-shadow:0 0 0 2px var(--p)}
.btn-p{width:100%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;padding:13px;border-radius:12px;margin-top:6px}
.btn-p:disabled{opacity:.6}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--mut)}
.switch button{color:var(--p);font-weight:700}
.msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:10px}
.msg.err{background:#ffeef0;color:#c9304a}.msg.ok{background:#e9f8f0;color:#1f8a52}

/* App */
#app{height:100%;display:grid;grid-template-columns:var(--listw) 1fr 300px;background:var(--card);overflow:hidden}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:14px}
.rail .logo{margin-bottom:8px;width:42px;height:42px;font-size:19px}
.ric{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#a8aed6;font-size:20px;position:relative}
.ric.on{background:rgba(255,255,255,.14);color:#fff}
.ric .b{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.sp{flex:1}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{padding:22px 20px 10px}
.lh h2{font-size:23px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.plus{width:36px;height:36px;border-radius:12px;background:var(--p);color:#fff;font-size:22px;line-height:1}
.search{margin-top:14px;background:var(--soft);border-radius:12px;padding:11px 14px;width:100%;font-size:14px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{font-size:13px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--soft);color:var(--tabtx)}
.tab.on{background:var(--p);color:#fff}
.convs{flex:1;overflow-y:auto;padding-bottom:10px}
.conv{display:flex;gap:12px;padding:12px 20px;align-items:center;width:100%;text-align:left;border-left:3px solid transparent}
.conv:hover{background:var(--hov)}
.conv.on{background:var(--sel);border-left-color:var(--p)}
.av{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.cm{flex:1;min-width:0}
.cm .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.cm .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .t span{font-weight:500;font-size:12px;color:#9aa0bb;flex:none}
.cm .p{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:13.5px;color:var(--mut);align-items:center}
.cm .p i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--p);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;flex:none}
.empty{padding:30px 24px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.chat{display:flex;flex-direction:column;background:var(--bg);min-height:0;min-width:0}
.ch{background:var(--card);padding:12px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.ch .n{font-weight:800;font-size:17px}.ch .s{font-size:13px;color:var(--mut);margin-top:2px}
.back{display:none;width:38px;height:38px;border-radius:12px;background:var(--soft);font-size:18px}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:17px}
.msgs{flex:1;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:4px}
.day{align-self:center;font-size:12px;font-weight:600;color:#8a90ad;background:var(--pill);padding:4px 12px;border-radius:12px;margin:10px 0 6px}
.m{max-width:min(68%,640px);padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m small{display:block;font-size:11px;margin-top:3px;opacity:.6;text-align:right;white-space:normal}
.m .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px}
.in{background:var(--card);align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 1px 3px rgba(30,40,90,.07)}
.out{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.m.gap{margin-top:8px}
.comp{background:var(--card);margin:0 22px 18px;border-radius:18px;padding:8px 10px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 4px 18px rgba(30,40,90,.08)}
.comp textarea{flex:1;resize:none;max-height:120px;padding:10px 8px;font-size:15px;line-height:1.4}
.send{width:42px;height:42px;border-radius:14px;background:var(--p);color:#fff;font-size:18px;flex:none}
.send:disabled{opacity:.5}
.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:10px;text-align:center;padding:20px}
.blank .logo{width:64px;height:64px;font-size:30px;border-radius:20px}
.info{border-left:1px solid var(--line);padding:28px 22px;text-align:center;overflow-y:auto}
.info .av{width:88px;height:88px;font-size:32px;margin:0 auto 12px}
.info h3{font-size:19px;font-weight:800}.info p{font-size:13px;color:var(--mut);margin-top:4px}
.sec{text-align:left;margin-top:22px}
.sec h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0bb;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}
.row span{color:#8a90ad}
.mem{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.mem .av{width:32px;height:32px;font-size:12px;margin:0}
.logout{color:var(--red);font-weight:600}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,24,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;padding:22px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal .x{font-size:20px;color:var(--mut)}
.modal .res{overflow-y:auto;margin-top:10px;flex:1}
.pick{display:flex;gap:12px;align-items:center;padding:9px 6px;border-radius:12px;width:100%;text-align:left}
.pick:hover{background:var(--hov2)}
.pick .av{width:38px;height:38px;font-size:14px}
.pick small{color:var(--mut);display:block;font-size:12px}
.chk{margin-left:auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--chk);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:none}
.chk.on{background:var(--p);border-color:var(--p)}
.mode{display:flex;gap:8px;margin-bottom:12px}


/* Mise à jour */
#upd{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--toast);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(20,24,50,.35);display:flex;gap:14px;align-items:center;font-size:14px;z-index:99;max-width:calc(100vw - 24px)}
#upd button{background:var(--p);color:#fff;font-weight:700;padding:7px 14px;border-radius:10px;white-space:nowrap}

/* Avatar / menu / réglages */
.meav{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.meav.mob{display:none;width:36px;height:36px;font-size:13px;box-shadow:none}
.hbtns{display:flex;gap:10px;align-items:center}
#menu{position:fixed;z-index:60;background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(20,24,50,.28);padding:8px;min-width:236px;max-width:calc(100vw - 24px);left:86px;bottom:18px}
#menu .mh{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
#menu .mh b{display:block;font-size:15px}#menu .mh span{font-size:12.5px;color:var(--mut);word-break:break-all}
#menu button{display:flex;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-size:14.5px;text-align:left;align-items:center}
#menu button:hover{background:var(--hov2)}#menu .mo-out{color:var(--red)}
.modal.set{max-width:620px;height:min(640px,88vh);max-height:none}
.stabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;flex:none}.stabs .tab{white-space:nowrap}
.sbody{flex:1;overflow-y:auto;padding:2px 2px 6px}
.pvav{width:84px;height:84px;border-radius:50%;color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin:2px auto 16px}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%}.sw .sel{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--p)}
.sbtn{background:var(--p);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;margin-top:4px}
.sbtn.ghost{background:var(--soft);color:var(--ink)}.sbtn.danger{background:var(--red)}.sbtn:disabled{opacity:.6}
.h5{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa0bb;margin:22px 0 8px;font-weight:700}
.hint2{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.4}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.sw2{width:46px;height:27px;border-radius:14px;background:var(--chk);position:relative;flex:none;transition:.15s}
.sw2:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
.sw2.on{background:var(--p)}.sw2.on:after{left:22px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border:2px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-weight:600;font-size:14px}
.th i{display:block;width:44px;height:30px;border-radius:8px;margin:0 auto 8px;border:1px solid var(--line)}
.th.on{border-color:var(--p);background:var(--sel)}
.dz{margin-top:26px;padding:16px;border:1px solid #ffc9d0;border-radius:14px}
.dz p{font-size:13px;color:var(--mut);margin:6px 0 12px;line-height:1.45}
.sbody .msg{margin:10px 0}
/* Fiche du contact : masquable, en volet sur fenêtre moyenne */
#app.noinfo{grid-template-columns:var(--listw) 1fr}
#app.noinfo .info{display:none}
.ch .sp{flex:1}
#infoBtn{font-size:20px;color:var(--mut);font-weight:700}
#infoBtn:hover{color:var(--p)}
@media(max-width:1399px){
 :root{--listw:300px}
 #app{grid-template-columns:var(--listw) 1fr}
 .info{position:fixed;right:0;top:0;bottom:0;width:320px;max-width:calc(100vw - 20px);z-index:40;background:var(--card);box-shadow:-10px 0 40px rgba(20,24,50,.28)}
}
@media(max-width:1020px){:root{--listw:280px}}
/* Mobile */
@media(max-width:900px){
 #app,#app.noinfo{grid-template-columns:1fr;position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
 html,body{overflow:hidden;overscroll-behavior:none}
 input,textarea{font-size:16px!important}
 .rail{display:none}
 .info{display:none}
 #app.mobinfo .info{display:block;position:fixed;left:0;right:0;top:0;bottom:0;width:auto;max-width:none;z-index:45;box-shadow:none;padding-top:64px}
 #app.mobinfo .info .back{display:block;position:absolute;left:14px;top:14px}
 .ch .av,.ch .n{cursor:pointer}
 #chSub:after{content:' ›'}
 .list{border-right:none}
 #app.inchat .list{display:none}
 #app:not(.inchat) .chat{display:none}
 .back{display:block}
 .meav.mob{display:flex}
 #infoBtn{display:none}
 #menu{left:auto;right:12px;top:64px;bottom:auto}
 .two{grid-template-columns:1fr 1fr}
 .m{max-width:84%}
 .msgs{padding:14px 12px}
 .comp{margin:0 10px calc(10px + env(safe-area-inset-bottom))}
}

.av{position:relative}
.av.on::after{content:'';position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#2fbf71;border:2px solid var(--card)}
.ch .s.live{color:#1f9d5c}
.m{position:relative}.m:not(.del){cursor:pointer}
.m .q{display:block;border-left:3px solid currentColor;background:rgba(127,127,127,.16);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:12.5px;cursor:pointer;white-space:normal}
.m .q b{display:block;font-size:12px}.m .q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;opacity:.85}
.m.del{opacity:.65;font-style:italic}
.m .pj{display:block;max-width:100%;max-height:320px;min-width:140px;min-height:90px;border-radius:12px;margin-bottom:4px;object-fit:cover;background:rgba(127,127,127,.18)}
.m .file{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(127,127,127,.16);margin-bottom:4px;text-decoration:none;color:inherit;font-weight:600;white-space:normal}
.m .file small{display:block;margin:0;text-align:left;opacity:.7;font-weight:400}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rx{font-size:12.5px;padding:1px 7px;border-radius:12px;background:rgba(127,127,127,.2);border:1px solid transparent;color:inherit}
.rx.mine{border-color:var(--p);background:rgba(108,99,255,.2)}
.out .rx.mine{border-color:#fff}
.rd{color:#bff3ff;font-weight:700}
.hl{animation:hl 1.3s}@keyframes hl{0%,70%{box-shadow:0 0 0 3px var(--p)}100%{box-shadow:0 0 0 0 transparent}}
#mmenu{position:fixed;z-index:82;background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(20,25,60,.28);padding:6px;min-width:200px}
#mmenu .em{display:flex;gap:2px;padding:4px 4px 6px;border-bottom:1px solid var(--line2);margin-bottom:4px}
#mmenu .em button{font-size:22px;width:36px;height:36px;border-radius:10px}
#mmenu .em button.on,#mmenu .em button:hover,#mmenu .it:hover{background:var(--soft)}
#mmenu .it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14.5px}#mmenu .it .ico{width:18px;height:18px;flex:none;opacity:.75}#mmenu .it.red .ico{opacity:1}
#mmenu .it.red{color:#d93a55}
.bar{margin:0 22px 8px;display:flex;flex-direction:column;gap:6px}
.bar .bi{display:flex;align-items:center;gap:8px;background:var(--card);border-left:3px solid var(--p);border-radius:10px;padding:6px 10px;font-size:13px}
.bar .bi div{flex:1;min-width:0}.bar .bi b{display:block;font-size:12px;color:var(--p)}
.bar .bi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.bar .bi button{width:26px;height:26px;border-radius:8px;background:var(--soft)}
.clip{width:42px;height:42px;border-radius:14px;font-size:19px;flex:none}
@media(max-width:900px){.bar{margin:0 10px 6px}}

/* ===== Design v2 ===== */
.rail{display:none}
.zoomable{cursor:zoom-in}
.cw.pvhide .conv{visibility:hidden}
@media (hover:none){.conv{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
#cdim{position:fixed;inset:0;z-index:79;background:rgba(5,6,20,.66)}
#cpv{position:fixed;z-index:81;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.45);overflow:hidden}

/* ---------- AUTH ---------- */
function setAuthMode(signup){
  S.signup=signup;
  const au=$('auth');au.classList.toggle('up',signup);au.classList.remove('rec');S.rec=false;
  $('signupOnly').classList.toggle('hidden',!signup);
  $('fMail').required=true;
  $('authH').textContent=signup?'Crée ton compte.':'Retrouve tes discussions.';
  $('authBtn').textContent=signup?'Créer mon compte':'Se connecter';
  $('swTxt').textContent=signup?'Déjà un compte ?':'Pas encore de compte ?';
  $('swBtn').textContent=signup?'Se connecter':'Créer un compte';
  $('fPass').autocomplete=signup?'new-password':'current-password';
  $('fPass').placeholder='Mot de passe';
  $('authMsg').innerHTML='';
}
function showRecovery(){
  S.rec=true;S.signup=false;
  const au=$('auth');au.classList.remove('up');au.classList.add('rec');
  $('app').classList.add('hidden');au.classList.remove('hidden');
  $('signupOnly').classList.add('hidden');$('fMail').required=false;
  $('authH').textContent='Nouveau mot de passe.';
  $('authBtn').textContent='Enregistrer';
  $('fPass').value='';$('fPass').autocomplete='new-password';$('fPass').placeholder='Nouveau mot de passe';
  $('authMsg').innerHTML='';
}

$('fgBtn').onclick=async()=>{
  const email=$('fMail').value.trim();
  if(!email){authMsg('Entre ton e-mail ci-dessus, puis touche « Mot de passe oublié ? ».','err');$('fMail').focus();return}
  $('fgBtn').disabled=true;
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error)authMsg(/rate|seconds/i.test(error.message)?'Patiente une minute avant de redemander un e-mail.':error.message,'err');
    else authMsg('Si un compte existe pour cette adresse, un e-mail pour changer ton mot de passe vient d’être envoyé.','ok');
  }finally{$('fgBtn').disabled=false}
};
$('swBtn').onclick=()=>setAuthMode(!S.signup);
const authMsg=(t,k)=>$('authMsg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`;
$('authForm').onsubmit=async e=>{
  e.preventDefault();
  const email=$('fMail').value.trim(),password=$('fPass').value;
  $('authBtn').disabled=true;$('authMsg').innerHTML='';
  try{
    if(S.rec){
      if(password.length<8){authMsg('8 caractères minimum.','err');return}
      const {data,error}=await sb.auth.updateUser({password});
      if(error){authMsg(/same|different/i.test(error.message)?'Choisis un mot de passe différent de l’ancien.':error.message,'err');return}
      S.rec=false;history.replaceState(null,'',location.pathname+location.search);
      $('auth').classList.remove('rec');
      if(data?.user)boot(data.user);
      return;
    }
    if(S.signup){
      const first_name=$('fFirst').value.trim(),last_name=$('fLast').value.trim(),birth_date=$('fBirth').value;
      if(!first_name){authMsg('Indique ton prénom.','err');return}
      if(password.length<8){authMsg('Mot de passe : 8 caractères minimum.','err');return}
      if(!last_name){authMsg('Indique ton nom.','err');return}
      const bd=new Date(birth_date+'T00:00:00');
      if(!birth_date||isNaN(bd)||bd>new Date()||bd<new Date('1900-01-01T00:00:00')){authMsg('Indique une date de naissance valide.','err');return}
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name,last_name,birth_date}}});
      if(error){authMsg(/already registered/i.test(error.message)?'Cette adresse e-mail est déjà utilisée.':error.message,'err');return}
      if(!data.session){setAuthMode(false);authMsg('Compte créé. Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.','ok')}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)authMsg(error.message==='Invalid login credentials'?'E-mail ou mot de passe incorrect.':error.message,'err');
    }
  }finally{$('authBtn').disabled=false}
};
async function logout(){
  try{await pushDetach()}catch(e){}
  stopPresence();
  if(S.chan){sb.removeChannel(S.chan);S.chan=null}
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){setTimeout(showRecovery,0);return}
  if(session?.user){ if(S.rec)return; if(S.me?.id!==session.user.id) setTimeout(()=>boot(session.user),0) }
  else{
    try{stopPresence()}catch(e){}
    try{if(tch){sb.removeChannel(tch);tch=null;tchId=null;tReady=false}}catch(e){}
    try{if(S.chan){sb.removeChannel(S.chan);S.chan=null}}catch(e){}
    Object.assign(S,{me:null,convs:[],cur:null,msgs:{},react:{},urls:{},fr:[],frp:{},frLoaded:false,online:new Set(),away:new Set(),seen:{},reply:null,edit:null,att:null,sq:null,typing:null,email:''});
    frRefresh=null;
    $('modalHost').innerHTML='';$('menu').classList.add('hidden');$('app').classList.remove('inchat','mobinfo');
    $('convs').innerHTML='';$('frBan').classList.add('hidden');
    $('app').classList.add('hidden');$('auth').classList.remove('hidden');
  }
});

/* ---------- BOOT ---------- */
async function boot(user){
  // profil, conversations, amis et « Vu à » partent en même temps (au lieu d'une file d'attente)
  S.me={id:user.id};
  const profP=sb.from('profiles').select('*').eq('id',user.id).single();
  const convP=loadConvs(),frP=loadFriends(),seenP=loadSeen();
  const {data:prof,error}=await profP;
  if(error||!prof){S.me=null;authMsg('Profil introuvable : '+(error?.message||''),'err');return}
  S.me=prof;S.email=user.email||'';renderMe();
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  await convP;renderAll();            // la liste s'affiche dès que les conversations sont là
  await Promise.all([frP,seenP]);
  S.convs.forEach(c=>{if(c.other&&!S.frp[c.other.id])S.frp[c.other.id]=c.other});
  subscribe();
  startPresence();
  renderAll();
  if(prefs.push&&pushSupported()&&Notification.permission==='granted')pushSubscribe().catch(()=>{});
  const wanted=new URLSearchParams(location.search).get('c');
  if(wanted&&S.convs.some(c=>c.id===wanted)){openConv(wanted);if(new URLSearchParams(location.search).get('reply'))setTimeout(()=>txt.focus(),400)}
  if(new URLSearchParams(location.search).get('req'))setTimeout(openRequests,300);
  if(location.search)history.replaceState(history.state,'',location.pathname);
  renderInv();
}

async function loadConvs(){
  const {data:mine,error}=await sb.from('conversation_members').select('conversation_id,last_read_at,muted,pinned,cleared_at,conversations(id,created_at,eph_secs)').eq('user_id',S.me.id);
  if(error){console.error(error);return}
  const ids=mine.map(m=>m.conversation_id);
  if(!ids.length){S.convs=[];return}
  const [{data:mem},{data:recent}]=await Promise.all([
    sb.from('conversation_members').select('conversation_id,user_id,last_read_at,last_delivered_at,profiles(id,username,display_name,first_name,last_name,color,avatar_path)').in('conversation_id',ids),
    sb.from('messages').select(MCOLS).in('conversation_id',ids).order('created_at',{ascending:false}).limit(400)
  ]);
  const byConv={},readAt={},delivAt={};
  (mem||[]).forEach(m=>{if(m.profiles)(byConv[m.conversation_id]??=[]).push(m.profiles);readAt[m.conversation_id+m.user_id]=m.last_read_at;delivAt[m.conversation_id+m.user_id]=m.last_delivered_at});
  const lastBy={};
  (recent||[]).forEach(m=>{(lastBy[m.conversation_id]??=[]).push(m)});
  S.convs=mine.map(m=>{
    const c=m.conversations,members=byConv[c.id]||[];
    const other=members.find(p=>p.id!==S.me.id);
    const msgs=(lastBy[c.id]||[]).filter(x=>!m.cleared_at||x.created_at>m.cleared_at);
    const unread=msgs.filter(x=>x.sender_id!==S.me.id&&x.created_at>m.last_read_at).length;
    return {id:c.id,name:other?.display_name||'Utilisateur supprimé',color:colorOf(c.id,other?.color),other,members,last:msgs[0]||null,unread,created_at:c.created_at,eph:c.eph_secs||2592000,last_read_at:m.last_read_at,muted:!!m.muted,pinned:!!m.pinned,cleared:m.cleared_at||null,other_read:other?readAt[c.id+other.id]:null,other_deliv:other?delivAt[c.id+other.id]:null};
  });
  sortConvs();
}
const sortConvs=()=>S.convs.sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||(b.last?.created_at||b.created_at).localeCompare(a.last?.created_at||a.created_at));

/* ---------- REALTIME ---------- */
function subscribe(){
  if(S.chan)sb.removeChannel(S.chan);
  S.chan=sb.channel('polymess')
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>onNewMsg(p.new))
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>onMsgUpdate(p.new))
   .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>onMsgDelete(p.old))
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},p=>onConvUpdate(p.new))
   .on('postgres_changes',{event:'*',schema:'public',table:'friendships'},()=>loadFriends())
   .on('postgres_changes',{event:'*',schema:'public',table:'reactions'},p=>onReaction(p))
   .on('postgres_changes',{event:'*',schema:'public',table:'presence_seen'},p=>{if(p.eventType==='DELETE'){const u=p.old&&p.old.user_id;if(u&&u!==S.me.id&&S.seen[u]){delete S.seen[u];updateSub();renderList()}return}const r=p.new;if(!r||!r.user_id||r.user_id===S.me.id)return;S.seen[r.user_id]=r.seen_at;updateSub();renderList()})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversation_members'},p=>onMemberUpdate(p.new))
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'conversation_members',filter:'user_id=eq.'+S.me.id},async()=>{await loadConvs();renderAll()})
   .subscribe();
}
const EXP_MS=24*3600*1000;
const attExpired=m=>!!m.att_path&&m.att_path!=='local'&&(!!m.att_expired_at||Date.now()-new Date(m.created_at).getTime()>=EXP_MS);
const expLeft=m=>new Date(m.created_at).getTime()+EXP_MS-Date.now();
const fmtLeft=ms=>{const h=Math.ceil(ms/3600000);if(ms>3600000)return h+' h';return Math.max(1,Math.ceil(ms/60000))+' min'};
const SOON=3*3600*1000;
const attLabel=m=>m.att_path?((m.att_type||'').startsWith('image/')?'📷 Photo':'📎 '+(m.att_name||'Fichier')):'';
const prevText=m=>m.deleted_at?'Message supprimé':(attLabel(m)+(attLabel(m)&&m.content?' ':'')+(m.content||''));
async function onNewMsg(m){
  let c=S.convs.find(x=>x.id===m.conversation_id);
  if(!c){await loadConvs();c=S.convs.find(x=>x.id===m.conversation_id);if(!c){renderAll();return}}
  c.last=m;
  if(m.sender_id!==S.me.id){
    ackDelivered();
    if(!c.muted&&prefs.sound&&(document.hidden||S.cur!==c.id))beep();
    if(!c.muted&&prefs.notif&&!prefs.push&&document.hidden&&'Notification' in window&&Notification.permission==='granted')
      showNotif(c.name,prevText(m).slice(0,140),c.id);
    clearTyping(c.id);
  }
  if(S.msgs[c.id]&&!S.msgs[c.id].some(x=>x.id===m.id))S.msgs[c.id].push(m);
  if(S.cur===c.id){
    if(m.sender_id!==S.me.id){if(document.hidden)c.unread++;else markRead(c.id)}
    renderMsgs(true)
  }else if(m.sender_id!==S.me.id)c.unread++;
  sortConvs();renderList();
}
async function markRead(cid){
  const c=S.convs.find(x=>x.id===cid);if(c){c.unread=0;renderList()}
  const {data}=await sb.rpc('mark_read',{cid});
  if(c&&data)c.last_read_at=data;
  clearNotifs(cid);
}
// ferme les bannières déjà affichées pour cette conversation
async function clearNotifs(cid){try{const r=await navigator.serviceWorker?.ready;(await r.getNotifications()).forEach(x=>{if(x.data&&x.data.cid===cid)x.close()})}catch(e){}}
function onMsgDelete(o){
  if(!o||!o.id)return;
  S.convs.forEach(c=>{const a=S.msgs[c.id];if(a){const i=a.findIndex(x=>x.id===o.id);if(i>=0){a.splice(i,1);if(S.cur===c.id)renderMsgs(false)}}});
  renderList();
}
function onConvUpdate(r){
  const c=S.convs.find(x=>x.id===r.id);if(!c)return;
  c.eph=r.eph_secs||c.eph;if(S.cur===c.id)renderInfo(c);
}
const EPH={172800:'48 heures',604800:'7 jours',2592000:'30 jours'};
const EPH_SUB={172800:'Deux jours',604800:'Une semaine',2592000:'Un mois'};
const msgGone=m=>!!m.expires_at&&new Date(m.expires_at).getTime()<=Date.now();
const msgLeft=m=>m.expires_at?new Date(m.expires_at).getTime()-Date.now():Infinity;
function openEph(c){
  const d=document.createElement('div');d.id='ephs';
  d.innerHTML=`<div class="ephbg"></div><div class="ephsh"><span class="ephgr"></span><h3>Messages éphémères</h3><p>Les nouveaux messages disparaissent après la durée choisie. Les messages déjà envoyés ne changent pas.</p>${[172800,604800,2592000].map(k=>`<button type="button" class="epho${c.eph===k?' on':''}" data-k="${k}"><span class="epht"><b>${EPH[k]==='48 heures'?'48 heures':EPH[k]}</b><small>${EPH_SUB[k]}</small></span><span class="ephrd">${c.eph===k?ico('tick'):''}</span></button>`).join('')}<button type="button" class="ephok">Terminé</button></div>`;
  document.body.appendChild(d);
  let sel=c.eph;
  const close=()=>d.remove();
  d.querySelector('.ephbg').onclick=close;d.querySelector('.ephok').onclick=async()=>{
    if(sel!==c.eph){
      const old=c.eph;c.eph=sel;renderInfo(c);
      const {error}=await sb.rpc('set_ephemeral',{conv:c.id,secs:sel});
      if(error){c.eph=old;renderInfo(c);flash('Impossible de changer la durée.')}
    }
    close()};
  d.querySelectorAll('.epho').forEach(b=>b.onclick=()=>{sel=+b.dataset.k;d.querySelectorAll('.epho').forEach(x=>{const on=+x.dataset.k===sel;x.classList.toggle('on',on);x.querySelector('.ephrd').innerHTML=on?ico('tick'):''})});

function onMsgUpdate(m){
  const c=S.convs.find(x=>x.id===m.conversation_id);if(!c)return;
  const arr=S.msgs[c.id];if(arr){const i=arr.findIndex(x=>x.id===m.id);if(i>=0)arr[i]=m}
  if(c.last&&c.last.id===m.id)c.last=m;
  if(m.deleted_at)S.react[c.id]=(S.react[c.id]||[]).filter(r=>r.message_id!==m.id);
  if(S.cur===c.id)renderMsgs(false);
  renderList();
}
function setReact(cid,mid,uid,emoji){
  const l=(S.react[cid]||[]).filter(r=>!(r.message_id===mid&&r.user_id===uid));
  if(emoji)l.push({message_id:mid,user_id:uid,emoji});
  S.react[cid]=l;
}
function onReaction(p){
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.message_id)return;
  if(p.eventType==='DELETE'){
    for(const k in S.react)S.react[k]=S.react[k].filter(x=>!(x.message_id===r.message_id&&x.user_id===r.user_id));
    if(S.cur)renderMsgs(false);return;
  }
  if(!r.conversation_id)return;
  setReact(r.conversation_id,r.message_id,r.user_id,r.emoji);
  if(S.cur===r.conversation_id)renderMsgs(false);
}
function onMemberUpdate(r){
  const c=S.convs.find(x=>x.id===r.conversation_id);if(!c)return;
  if(r.user_id===S.me.id){
    if((r.cleared_at||null)!==(c.cleared||null)){c.cleared=r.cleared_at||null;const a=(S.msgs[c.id]||[]).filter(x=>!c.cleared||x.created_at>c.cleared);S.msgs[c.id]=a;c.last=a[a.length-1]||null;c.unread=0;if(S.cur===c.id&&!c.last)closeChat();renderList();if(S.cur===c.id)renderMsgs(false);return}
    if(c.muted!==!!r.muted||c.pinned!==!!r.pinned){c.muted=!!r.muted;c.pinned=!!r.pinned;sortConvs();renderList();if(S.cur===c.id)renderInfo(c)}return}
  c.other_read=r.last_read_at;c.other_deliv=r.last_delivered_at;if(S.cur===c.id)renderMsgs(false);renderList();
}
async function loadReactions(id){
  const {data}=await sb.from('reactions').select('message_id,user_id,emoji,conversation_id').eq('conversation_id',id);
  if(data)S.react[id]=data;
}

/* ---------- RENDER ---------- */
const fmtTime=d=>new Date(d).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function fmtList(d){
  const x=new Date(d),n=new Date(),ds=(a,b)=>a.toDateString()===b.toDateString();
  if(ds(x,n))return fmtTime(d);
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(ds(x,y))return 'Hier';
  if(n-x<6*864e5)return x.toLocaleDateString('fr-FR',{weekday:'short'});
  return x.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}
function fmtDay(d){
  const x=new Date(d),n=new Date();
  if(x.toDateString()===n.toDateString())return 'Aujourd’hui';
  const y=new Date(n);y.setDate(n.getDate()-1);
  if(x.toDateString()===y.toDateString())return 'Hier';
  return x.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function renderAll(){renderList();renderChat()}

// ---- Balayage d'une ligne (écran tactile) : Épingler / Sourdine / Supprimer
let swOpen=null,sw=null;
const swClose=(animate=true)=>{if(!swOpen)return;const r=swOpen.querySelector('.conv');r.style.transition=animate?'transform .2s':'none';r.style.transform='';const w=swOpen;swOpen=null;setTimeout(()=>{if(w!==swOpen){w.classList.remove('open');r.style.background=''}},animate?210:0)};
const SWW=192;
$('convs').addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  const w=e.target.closest('.cw');
  if(swOpen&&(!w||w!==swOpen||!e.target.closest('.swa'))&&!(w&&w===swOpen&&e.target.closest('.swa')))swClose();
  if(!w||e.target.closest('.swa'))return;
  sw={w,x:e.clientX,y:e.clientY,id:e.pointerId,drag:false,base:swOpen===w?-SWW:0,dx:0};
},{passive:true});
$('convs').addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.5){
      sw.drag=true;const r=sw.w.querySelector('.conv');
      let bg='',el=$('convs');while(el&&(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)')){bg=getComputedStyle(el).backgroundColor;el=el.parentElement}
      r.style.background=bg;sw.w.classList.add('open');r.style.transition='none';try{$('convs').setPointerCapture(e.pointerId)}catch(_){}
      if(swOpen&&swOpen!==sw.w)swClose(false);
    }else if(Math.abs(dy)>12){sw=null;return}
    else return;
  }
  sw.dx=Math.min(0,Math.max(-SWW-30,sw.base+dx));
  sw.w.querySelector('.conv').style.transform=`translateX(${sw.dx}px)`;
});
const swEnd=e=>{
  if(!sw||(e&&e.pointerId!==sw.id))return;
  const s=sw;sw=null;if(!s.drag)return;
  s.w.dataset.drag=1;setTimeout(()=>delete s.w.dataset.drag,350);
  const r=s.w.querySelector('.conv');r.style.transition='transform .2s';
  if(s.dx<-SWW/2){r.style.transform=`translateX(${-SWW}px)`;swOpen=s.w}
  else{swOpen=s.w;swClose()}
};
['pointerup','pointercancel'].forEach(t=>$('convs').addEventListener(t,swEnd));
$('convs').addEventListener('click',e=>{
  const w=e.target.closest('.cw');
  if(w&&w.dataset.drag){e.stopImmediatePropagation();e.preventDefault();return}
  const b=e.target.closest('.swa button');
  if(b){
    e.stopImmediatePropagation();const c=S.convs.find(x=>x.id===w.dataset.id);if(!c)return;
    swClose();
    if(b.dataset.a==='pin')setFlag(c,'pinned',!c.pinned);
    else if(b.dataset.a==='mute')setFlag(c,'muted',!c.muted);
    else askDeleteConv(c);
    return;
  }
  if(swOpen){e.stopImmediatePropagation();e.preventDefault();swClose()}
},true);

  const bub=m=>`<div class="pm ${m.sender_id===S.me.id?'out':'in'}${m.deleted_at?' dl':''}">${esc(prevText(m)||'Message')}<small>${esc(fmtTime(m.created_at))}</small></div>`;

  const pv=document.createElement('div');pv.id='cpv';pv.innerHTML=`<div class="pmb">${body}</div><div class="pms"><i></i></div>`;document.body.appendChild(pv);
  const m=document.createElement('div');m.id='cmenu';
  const it=(a,ic,t,cls='')=>`<button type="button" class="it ${cls}" data-a="${a}">${ico(ic)}${t}</button>`;
  m.innerHTML=it('pin','pin',c.pinned?'Désépingler':'Épingler')+it('mute',c.muted?'bell':'bellOff',c.muted?'Réactiver le son':'Couper le son')+(c.unread?it('read','mail','Marquer comme lu'):incoming.length?it('unread','mail','Marquer comme non lu'):'')+it('prof','eye','Voir le profil')+it('del','trash','Supprimer','red');
  document.body.appendChild(m);
  w.classList.add('pvhide');
  const W=Math.min(innerWidth-28,420),L=Math.max(14,Math.min(r.left,innerWidth-W-14));
  pv.style.width=W+'px';pv.style.left=L+'px';m.style.left=L+'px';
  const ph=pv.offsetHeight,mh=m.offsetHeight;
  let top=r.top;if(top+ph+mh+18>innerHeight-10)top=Math.max(10,innerHeight-10-ph-mh-18);
  pv.style.top=top+'px';m.style.top=(top+ph+10)+'px';
  const pb=pv.querySelector('.pmb'),th=pv.querySelector('.pms i'),tr=pv.querySelector('.pms');
  const sync=()=>{const sh=pb.scrollHeight,ch=pb.clientHeight;if(sh<=ch+2){tr.style.display='none';return}tr.style.display='';const th_=Math.max(28,ch*ch/sh);th.style.height=th_+'px';th.style.transform=`translateY(${(ch-th_)*pb.scrollTop/(sh-ch)}px)`};
  pb.scrollTop=pb.scrollHeight;sync();pb.addEventListener('scroll',sync,{passive:true});
  m.onclick=async ev=>{
    const b=ev.target.closest('button');if(!b)return;closeCMenu();

    else askDeleteConv(c);

async function markUnread(c,last){
  if(!last)return;
  const t=new Date(new Date(last.created_at).getTime()-1).toISOString();
  const {error}=await sb.from('conversation_members').update({last_read_at:t}).eq('conversation_id',c.id).eq('user_id',S.me.id);
  if(error){flash('Impossible : '+error.message);return}
  c.last_read_at=t;c.unread=Math.max(1,(c._pv||[]).filter(x=>x.sender_id!==S.me.id&&!x.deleted_at&&x.created_at>t).length);
  renderList();
}
function askDeleteConv(c){
  const d=document.createElement('div');d.id='ephs';
  d.innerHTML=`<div class="ephbg"></div><div class="ephsh"><span class="ephgr"></span><h3>Supprimer la conversation ?</h3><p>Elle disparaît de ta liste et l’historique est effacé pour toi. ${esc(c.name)} garde ses messages. Si ${esc(c.name)} t’écrit de nouveau, la conversation réapparaît.</p><button type="button" class="dcb red">Supprimer</button><button type="button" class="dcb">Annuler</button></div>`;
  document.body.appendChild(d);
  const close=()=>d.remove();d.querySelector('.ephbg').onclick=close;
  d.querySelectorAll('.dcb')[1].onclick=close;
  d.querySelector('.dcb.red').onclick=async()=>{close();await deleteConv(c)};
}
async function deleteConv(c){
  const t=new Date(Math.max(Date.now(),c.last?new Date(c.last.created_at).getTime()+1:0)).toISOString();
  const {error}=await sb.from('conversation_members').update({cleared_at:t,last_read_at:t}).eq('conversation_id',c.id).eq('user_id',S.me.id);
  if(error){flash('Impossible de supprimer : '+error.message);return}
  c.cleared=t;c.last=null;c.unread=0;S.msgs[c.id]=[];S.react[c.id]=[];
  if(S.cur===c.id)closeChat();
  renderList();flash('Conversation supprimée.');
}

async function openConv(id){
  if(S.cur!==id){if(S.sq){S.sq=null;$('sbar').classList.add('hidden')}S.reply=null;S.att=null;if(S.edit){S.edit=null;txt.value=''}}
  if(innerWidth<=900&&!$('app').classList.contains('inchat'))pushPM('chat');
  S.cur=id;$('app').classList.add('inchat');
  renderAll();
  if(!S.msgs[id]){
    const {data,error}=await sb.from('messages').select(MCOLS).eq('conversation_id',id).order('created_at',{ascending:false}).limit(200);
    if(error){console.error(error);return}
    const cl=(S.convs.find(x=>x.id===id)||{}).cleared;
    S.msgs[id]=data.reverse().filter(x=>!cl||x.created_at>cl);
  }
  await loadReactions(id);
  joinTyping(id);
  if(S.cur!==id)return;
  renderMsgs(true);
  const c=S.convs.find(x=>x.id===id);if(c&&c.unread)markRead(id);
  if(window.innerWidth>900)$('txt').focus();
}

}
// après le départ d'un ami : durée depuis sa dernière activité (24 h max) ; anneau gris pendant 1 h sur les petits avatars
function leftAgo(id){
  if(!statusOn()||!id||S.online.has(id))return null;
  const t=S.seen[id];if(!t)return null;
  const ms=Date.now()-new Date(t).getTime();
  return ms<86400000?Math.max(0,ms):null;
}
const fmtAgo=ms=>{const m=Math.floor(ms/60000);return m<1?'1 min':m<60?m+' min':Math.floor(m/60)+' h'};
const ringOn=id=>{const a=leftAgo(id);return a!=null&&a<3600000};
function subText(c,typing=true){
  if(typing&&S.typing===c.id)return 'écrit…';
  if(statusOn()&&c.other&&S.online.has(c.other.id))return S.away.has(c.other.id)?'Absent':'En ligne';
  if(statusOn()&&c.other&&S.seen[c.other.id])return fmtSeen(S.seen[c.other.id]);
  return '';
}
async function setFlag(c,k,v){
  c[k]=v;sortConvs();renderList();renderInfo(c);
  const {error}=await sb.from('conversation_members').update({[k]:v}).eq('conversation_id',c.id).eq('user_id',S.me.id);
  if(error){c[k]=!v;sortConvs();renderList();renderInfo(c);alert('Impossible : '+error.message)}
}
function closeInfoPanel(){if(curPM==='info')history.back();else hideMobInfo();S.infoOverlay=false;applyInfo()}
function renderInfo(c){
  const back=`<button class="back" id="infoBack" aria-label="Retour">${ico('back')}</button>`;
  const media=(S.msgs[c.id]||[]).filter(m=>m.att_path&&m.att_path!=='local'&&!m.deleted_at&&!msgGone(m)).reverse();
  c._mc=media.length;
  const imgs=media.filter(m=>(m.att_type||'').startsWith('image/')).slice(0,9),files=media.filter(m=>!(m.att_type||'').startsWith('image/')).slice(0,5);
  const on=statusOn()&&c.other&&S.online.has(c.other.id);

function fmtSeenLong(d){
  const x=new Date(d),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const t=fmtTime(d);
  if(x.toDateString()===n.toDateString())return 'Aujourd’hui, '+t;
  if(x.toDateString()===y.toDateString())return 'Hier, '+t;
  return x.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+', '+t;
}
const RX=['👍','❤️','😂','😮','😢','🙏'];
const fmtSize=n=>!n?'':n<1024*1024?Math.max(1,Math.round(n/1024))+' Ko':(n/1048576).toFixed(1).replace('.',',')+' Mo';
const isRead=(c,m)=>!!c.other_read&&new Date(c.other_read)>=new Date(m.created_at);
const isDeliv=(c,m)=>isRead(c,m)||(!!c.other_deliv&&new Date(c.other_deliv)>=new Date(m.created_at));
let stick=true;
function cachedUrl(p){const e=S.urls[p];return e&&e.exp>Date.now()?e.url:null}
async function signedUrl(p,dl){
  if(!dl){const c=cachedUrl(p);if(c)return c}
  const {data,error}=await sb.storage.from('attachments').createSignedUrl(p,3600,dl?{download:dl}:undefined);
  if(error||!data)return null;
  if(!dl)S.urls[p]={url:data.signedUrl,exp:Date.now()+3000*1000};
  return data.signedUrl;
}
function hydrateImgs(){
  document.querySelectorAll('img.pj:not([src]),img.th:not([src])').forEach(async im=>{const u=await signedUrl(im.dataset.path);if(u)im.src=u});
}
function renderMsgs(scroll){
  const c=S.convs.find(x=>x.id===S.cur);if(!c)return;
  const list=(S.msgs[c.id]||[]).filter(m=>!msgGone(m)),el=$('msgs');
  c._es=list.filter(m=>msgLeft(m)<3600000).length;
  const near=el.scrollHeight-el.scrollTop-el.clientHeight<120;
  const byId=new Map(list.map(m=>[m.id,m]));
  const rx={};(S.react[c.id]||[]).forEach(r=>{(rx[r.message_id]??=[]).push(r)});
  let html='',lastDay='',lastSender='';

  for(let i=0;i<list.length;i++){
    const m=list[i];

    if(day!==lastDay){html+=`<div class="day">${esc(fmtDay(m.created_at))}</div>`;lastDay=day;lastSender=''}
    else if(i&&new Date(m.created_at)-new Date(list[i-1].created_at)>=1800000){html+=`<div class="tsep">${fmtTime(m.created_at)}</div>`;lastSender=''}
    const nx=list[i+1],cont=nx&&nx.sender_id===m.sender_id&&!nx.deleted_at&&new Date(nx.created_at).toDateString()===day&&(new Date(nx.created_at)-new Date(m.created_at))<300000;
    const mine=m.sender_id===S.me.id,gap=(lastSender!==m.sender_id?'gap':'')+(cont?' cont':'')+(hs&&hs.has(m.id)?' hit'+(S.sq.ids[S.sq.i]===m.id?' cur':''):'');
    lastSender=m.sender_id;
    let avh='';
    if(!mine){const au=c.members.find(p=>p.id===m.sender_id)||c.other;if(!cont&&au)avh=`<span class="mav2" style="background:${avBg(esc(colorOf(au.id,au.color)),au.avatar_path)}">${avTxt(au.display_name,au.avatar_path)}</span>`}
    if(m.deleted_at){html+=`<div class="m del ${mine?'out':'in'} ${gap}" data-id="${esc(m.id)}">${avh}${ico('trash','dl')}<em>Message supprimé</em><small>${fmtTime(m.created_at)}</small></div>`;continue}
    let q='';
    if(m.reply_to){const o=byId.get(m.reply_to);q=`<div class="q" data-go="${esc(m.reply_to)}"><b>${esc(o?(o.sender_id===S.me.id?'Toi':c.name):'Message')}</b><span>${esc(o?prevText(o):'Message d’origine indisponible')}</span></div>`}
    let att='';
    if(m.att_path){
      const isImg=(m.att_type||'').startsWith('image/');
      if(attExpired(m)){
        att=`<div class="pjx">${ico(isImg?'image':'file')}<span><b>${isImg?'Photo':esc(m.att_name||'Fichier')}</b>Fichier expiré</span></div>`;
      }else{
        if(isImg){const u=m.localUrl||cachedUrl(m.att_path);att=`<img class="pj" alt="${esc(m.att_name||'image')}" data-path="${esc(m.att_path)}"${u?` src="${esc(u)}"`:''}>`}
        else att=`<a class="file" href="#" data-path="${esc(m.att_path)}" data-name="${esc(m.att_name||'fichier')}">${ico('file')}<span>${esc(m.att_name||'Fichier')}<small>${fmtSize(m.att_size)}</small></span></a>`;
        if(m.att_path!=='local'){const l=expLeft(m);att+=`<div class="pjex${l<SOON?' soon':''}" data-t="${new Date(m.created_at).getTime()}">${ico('clock','mini')}<span>Expire dans ${fmtLeft(l)}</span><button type="button" class="sv" data-path="${esc(m.att_path)}" data-name="${esc(m.att_name||'fichier')}">${ico('download','mini')}Enregistrer</button></div>`}
      }
    }

      rh=`<div class="rxs">${Object.entries(g).map(([e,u])=>`<button class="rx ${u.includes(S.me.id)?'mine':''}" data-e="${e}" data-id="${esc(m.id)}">${e}${u.length>1?' '+u.length:''}</button>`).join('')}</div>`}
    const tick=mine?(m.pending?` <span class="tk">${ico('clock')}</span>`:(isRead(c,m)?` <span class="tk rd">${ico('ticks')}</span>`:isDeliv(c,m)?` <span class="tk">${ico('ticks')}</span>`:` <span class="tk">${ico('tick')}</span>`)):'';
    html+=`<div class="m ${mine?'out':'in'} ${gap}" data-id="${esc(m.id)}">${avh}${q}${att}${m.content?esc(m.content):''}${rh}${msgLeft(m)<3600000?`<div class="te" data-x="${new Date(m.expires_at).getTime()}">${ico('clock','mini')}Disparaît dans ${fmtLeft(msgLeft(m))}</div>`:''}<small>${m.edited_at?'modifié · ':''}${fmtTime(m.created_at)}${tick}</small></div>`;
  }
  el.innerHTML=html||(S.msgs[c.id]?`<div class="empty">${ico('wave','big')}<br>Dis bonjour</div>`:'');
  if(c._mc!==undefined&&(list.filter(x=>x.att_path&&x.att_path!=='local'&&!x.deleted_at).length!==c._mc))renderInfo(c);
  stick=near||scroll===true;
  if(scroll&&(near||scroll===true))el.scrollTop=el.scrollHeight;
  hydrateImgs();
}

function openMsgMenu(el){
  closeMenu();

  const m=(S.msgs[S.cur]||[]).find(x=>x.id===id);if(!m)return;
  const mine=m.sender_id===S.me.id;
  const myR=(S.react[S.cur]||[]).find(r=>r.message_id===id&&r.user_id===S.me.id)?.emoji;

  d.innerHTML=`<div class="em">${RX.map(e=>`<button data-e="${e}" class="${e===myR?'on':''}">${e}</button>`).join('')}</div>
   <button class="it" data-a="reply">${ico('reply')}Répondre</button>${m.content?`<button class="it" data-a="copy">${ico('copy')}Copier</button>`:''}${att?`<button class="it" data-a="save">${ico('download')}Enregistrer</button>`:''}<button class="it" data-a="fwd">${ico('share')}Transférer</button><button class="it" data-a="info">${ico('info')}Infos</button>${mine&&!m.att_path?`<button class="it" data-a="edit">${ico('edit')}Modifier</button>`:''}${mine?`<button class="it red" data-a="del">${ico('trash')}Supprimer</button>`:''}`;
  // le reste de l'écran s'assombrit, le message touché reste net et surligné
  const r0=el.getBoundingClientRect();

  const cl=el.cloneNode(true);cl.id='mclone';cl.classList.add('mclone');cl.removeAttribute('data-id');
  cl.style.cssText=`position:fixed;left:${r0.left}px;top:${r0.top}px;width:${r0.width}px;margin:0;`;
  document.body.appendChild(cl);

  const r=r0,w=d.offsetWidth,h=d.offsetHeight;
  let top=r.top-h-6;if(top<8)top=Math.max(8,Math.min(r.bottom+6,innerHeight-h-8));
  let left=mine?r.right-w:r.left;left=Math.max(8,Math.min(left,innerWidth-w-8));
  d.style.top=top+'px';d.style.left=left+'px';
  d.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;closeMenu();
    if(b.dataset.e)toggleReact(id,b.dataset.e);

  const c=S.convs.find(x=>x.id===m.conversation_id);if(!c)return;
  const mine=m.sender_id===S.me.id;
  const row=(ic,t,s,cls='')=>`<div class="mir ${cls}">${ico(ic)}<div><b>${t}</b><span>${s}</span></div></div>`;
  let rows=row(mine?'send':'tick',mine?'Envoyé':'Reçu',esc(fmtWhen(m.created_at)));
  if(mine)rows+=isRead(c,m)?row('ticks','Lu','Dernière lecture : '+esc(fmtWhen(c.other_read)),'g'):(isDeliv(c,m)?row('ticks','Reçu','Pas encore lu par '+esc(c.name)):row('tick','Pas encore reçu','Envoyé à '+esc(c.name)));

  if(m.expires_at)rows+=row('clock','Disparaît',msgLeft(m)>0?'Dans '+esc(fmtLeft(msgLeft(m)))+' ('+esc(fmtWhen(m.expires_at))+')':'Bientôt');

// ---- Transférer
function openForward(m){
  if(m.att_path&&m.att_path!=='local'&&attExpired(m)){flash('La pièce jointe a expiré : impossible de la transférer.');return}
  const fr=S.fr.filter(r=>r.status==='accepted').map(r=>S.frp[frOther(r)]).filter(Boolean).filter(p=>p.id!==S.convs.find(x=>x.id===m.conversation_id)?.other?.id);
  const d=document.createElement('div');d.id='ephs';
  d.innerHTML=`<div class="ephbg"></div><div class="ephsh"><span class="ephgr"></span><h3>Transférer à…</h3>${fr.length?'<div class="fwl">'+fr.map(p=>`<button type="button" class="fwb" data-id="${esc(p.id)}"><div class="av" style="background:${avBg(esc(colorOf(p.id,p.color)),p.avatar_path)}">${avTxt(p.display_name,p.avatar_path)}</div><b>${esc(p.display_name)}</b><span class="fws">Envoyer</span></button>`).join('')+'</div>':'<p>Tu n’as pas d’autre ami à qui transférer ce message.</p>'}</div>`;
  document.body.appendChild(d);
  const close=()=>d.remove();d.querySelector('.ephbg').onclick=close;
  d.querySelectorAll('.fwb').forEach(b=>b.onclick=async()=>{
    const s=b.querySelector('.fws');if(s.dataset.busy)return;s.dataset.busy=1;s.textContent='…';
    const ok=await forwardTo(m,b.dataset.id);
    if(ok){close();flash('Message transféré.')}else{delete s.dataset.busy;s.textContent='Envoyer'}
  });
}
async function forwardTo(m,pid){
  let conv=S.convs.find(x=>x.other?.id===pid),cid=conv?.id;
  if(!cid){
    const {data,error}=await sb.rpc('start_direct',{other:pid});
    if(error){flash('Impossible : '+error.message);return false}
    cid=data;await loadConvs();conv=S.convs.find(x=>x.id===cid);
  }
  const row={conversation_id:cid,sender_id:S.me.id,content:m.content||''};
  let np=null;
  if(m.att_path&&m.att_path!=='local'){
    const safe=String(m.att_name||'fichier').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
    np=`${cid}/${crypto.randomUUID()}-${safe}`;
    const cp=await sb.storage.from('attachments').copy(m.att_path,np);
    if(cp.error){flash('Impossible de transférer la pièce jointe.');return false}
    Object.assign(row,{att_path:np,att_name:m.att_name,att_type:m.att_type,att_size:m.att_size});
  }
  const {data,error}=await sb.from('messages').insert(row).select(MCOLS).single();
  if(error){if(np)sb.storage.from('attachments').remove([np]);flash('Envoi impossible : '+error.message);return false}
  const arr=S.msgs[cid];if(arr&&!arr.some(x=>x.id===data.id))arr.push(data);
  if(conv){conv.last=data;sortConvs()}
  renderList();if(S.cur===cid)renderMsgs(true);
  return true;
}

  setReact(cid,mid,S.me.id,mine&&mine.emoji===emoji?null:emoji);renderMsgs(false);
  const {error}=await sb.rpc('toggle_reaction',{mid,e:emoji});
  if(error){await loadReactions(cid);renderMsgs(false)}
}

async function delMsg(m){

    d.innerHTML=`<div class="crt"><button class="crx" type="button" aria-label="Annuler">${ico('close')}</button><b>Recadrer la photo</b></div>
     <div class="crs"><img class="cri" alt="" draggable="false"><div class="crm"></div><div class="crr"></div><span class="crh">Pince pour zoomer · glisse pour déplacer</span></div>
     <div class="crz"><span>−</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span>+</span></div>
     <div class="crb"><button type="button" class="crok">Enregistrer</button><button type="button" class="crno">Annuler</button></div>`;
    document.body.appendChild(d);

    st.style.setProperty('--d',D+'px');im.src=url;
    const clamp=()=>{const k=base*s,mx=Math.max(0,(W*k-D)/2),my=Math.max(0,(H*k-D)/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty))};
    const draw=()=>{clamp();const k=base*s;im.style.width=W*k+'px';im.style.height=H*k+'px';im.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px))`;rg.value=s};
    const zoom=n=>{s=Math.min(4,Math.max(1,n));draw()};
    const end=v=>{URL.revokeObjectURL(url);d.remove();document.removeEventListener('keydown',key);ok(v)};
    st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);ps=s}});
    st.addEventListener('pointermove',e=>{

    rg.oninput=()=>zoom(+rg.value);
    const key=e=>{if(e.key==='Escape')end(null)};document.addEventListener('keydown',key);
    d.querySelector('.crx').onclick=d.querySelector('.crno').onclick=()=>end(null);

    };

  });
}

// départ d'un ami : on prend l'heure réelle de la base (dernière activité), et l'heure locale seulement en secours
function syncSeenOne(id){
  if(!S.seen[id])S.seen[id]=new Date().toISOString();
  sb.from('presence_seen').select('seen_at').eq('user_id',id).maybeSingle().then(({data})=>{if(data&&data.seen_at){S.seen[id]=data.seen_at;updateSub();renderList()}},()=>{});
}
// passage de minuit : « Vu à » devient « Vu hier à » sans attendre une autre mise à jour
let seenDay=new Date().toDateString();
setInterval(()=>{const d=new Date().toDateString();if(d!==seenDay){seenDay=d;if(S.me){updateSub();renderList()}}},30000);
// les durées (« 5 min », « 3 h ») avancent d'elles-mêmes, sans toucher à une ligne en cours de balayage
setInterval(()=>{if(S.me&&statusOn()&&!document.hidden&&!sw&&!swOpen){updateSub();renderList()}},60000);
function setFriendPresence(id,entries){
  if(entries.length){
    rawOn.add(id);delete goneAt[id];
    entries.some(e=>!e.away)?S.away.delete(id):S.away.add(id);
  }else if(rawOn.has(id)){
    rawOn.delete(id);goneAt[id]=Date.now();syncSeenOne(id);
  }
  calcOnline();
}
// abonne aux canaux des amis (un par ami) et retire ceux qui ne le sont plus
function syncPresence(){
  if(!pch)return;
  const want=new Set(friendIds());let changed=false;
  for(const id of Object.keys(pfr))if(!want.has(id)){try{sb.removeChannel(pfr[id])}catch(e){}delete pfr[id];rawOn.delete(id);delete goneAt[id];S.away.delete(id);changed=true}
  for(const id of want)if(!pfr[id]){
    const ch=sb.channel('presence:'+id,{config:{private:true}});
    ch.on('presence',{event:'sync'},()=>setFriendPresence(id,presFlat(ch))).subscribe();
    pfr[id]=ch;
  }
  if(changed)calcOnline();
}
// retour dans l'appli : on repart de l'état réel des canaux, sans délai de grâce fantôme
function resyncPresence(){
  rawOn=new Set();goneAt={};
  for(const id in pfr){const e=presFlat(pfr[id]);if(e.length){rawOn.add(id);e.some(x=>!x.away)?S.away.delete(id):S.away.add(id)}}
  calcOnline();
}
const trackMe=()=>{if(pch&&!document.hidden)pch.track({at:Date.now(),away:myAway})};
function setAway(v){if(v===myAway)return;myAway=v;trackMe()}
function bumpActive(){
  if(!pch)return;
  const n=Date.now();if(!myAway&&n-lastBump<3000)return;lastBump=n;
  clearTimeout(idleT);if(myAway)setAway(false);
  idleT=setTimeout(()=>setAway(true),IDLE);
}
['pointerdown','keydown','touchstart','mousemove','scroll'].forEach(ev=>addEventListener(ev,bumpActive,{passive:true,capture:true}));
async function loadSeen(){
  try{const {data}=await sb.from('presence_seen').select('user_id,seen_at');if(data){S.seen={};data.forEach(r=>S.seen[r.user_id]=r.seen_at)}}catch(e){}
}
// sb.rpc() ne part que si on l'attend : sans .then() la requête n'était jamais envoyée
const seenCall=v=>{try{sb.rpc('touch_seen',{visible:v}).then(()=>{},()=>{})}catch(e){}};
const touchSeen=()=>seenCall(true);
// accusé de réception (« reçu ») : le serveur ne l'enregistre que si le statut en ligne est actif
const ackDelivered=()=>{try{sb.rpc('mark_delivered').then(()=>{},()=>{})}catch(e){}};
const ackAfterTouch=async()=>{try{await sb.rpc('touch_seen',{visible:true});await sb.rpc('mark_delivered')}catch(e){}};
function stopPresence(){
  clearInterval(seenTimer);clearTimeout(graceT);clearTimeout(idleT);rawOn=new Set();goneAt={};myAway=false;
  for(const id of Object.keys(pfr)){try{sb.removeChannel(pfr[id])}catch(e){}}pfr={};
  if(pch){sb.removeChannel(pch);pch=null}S.online=new Set();S.away=new Set();
}
function startPresence(){
  stopPresence();
  if(!S.me)return;
  if(!statusOn()){seenCall(false);return}
  pch=sb.channel('presence:'+S.me.id,{config:{private:true,presence:{key:S.me.id}}});
  pch.subscribe(st=>{if(st==='SUBSCRIBED')trackMe()});
  syncPresence();bumpActive();
  ackAfterTouch();seenTimer=setInterval(()=>{if(!document.hidden)touchSeen()},60000);
}

const FPROF='id,display_name,first_name,last_name,color,avatar_path';
const frRow=id=>S.fr.find(r=>r.requester===id||r.addressee===id);
function frState(id){const r=frRow(id);if(!r)return 'none';if(r.status==='accepted')return 'friends';return r.requester===S.me.id?'sent':'received'}
const frIncoming=()=>S.fr.filter(r=>r.status==='pending'&&r.addressee===S.me.id);
const frOutgoing=()=>S.fr.filter(r=>r.status==='pending'&&r.requester===S.me.id);
const frOther=r=>r.requester===S.me.id?r.addressee:r.requester;
async function loadFriends(){
  const {data,error}=await sb.from('friendships').select('id,requester,addressee,status,created_at,accepted_at');
  if(error){console.error(error);return}
  S.fr=data||[];
  const need=[...new Set(S.fr.map(frOther))].filter(id=>!S.frp[id]);
  if(need.length){const {data:ps}=await sb.from('profiles').select(FPROF).in('id',need);(ps||[]).forEach(p=>S.frp[p.id]=p)}
  S.convs.forEach(c=>{if(c.other&&!S.frp[c.other.id])S.frp[c.other.id]=c.other});
  S.frLoaded=true;renderFr();syncPresence();
  if(S.cur){const c=S.convs.find(x=>x.id===S.cur);if(c){applyLock();renderInfo(c)}}
  if(typeof frRefresh==='function')frRefresh();
}
function renderFr(){
  const n=frIncoming(),b=$('frBan');
  if(!n.length){b.classList.add('hidden');b.innerHTML='';return}
  const names=n.map(r=>(S.frp[r.requester]||{}).display_name||'').filter(Boolean);
  b.innerHTML=`<span class="fri">${ico('user')}</span><span class="frt"><b>${n.length} demande${n.length>1?'s':''} d’ami${n.length>1?'s':''}</b><small>${esc(names.slice(0,2).join(', ')+(names.length>2?'…':''))}</small></span><span class="frc">${ico('back')}</span>`;
  b.classList.remove('hidden');
}
$('frBan').onclick=()=>openRequests();
function applyLock(){
  const c=S.convs.find(x=>x.id===S.cur),l=$('frLock');
  const lock=!!c&&c.other&&S.frLoaded&&frState(c.other.id)!=='friends';
  $('comp').classList.toggle('hidden',lock);
  l.classList.toggle('hidden',!lock);
  if(!lock){l.innerHTML='';return}
  const st=frState(c.other.id);
  l.innerHTML=`<span>${st==='sent'?'Demande envoyée. Tu pourras écrire dès qu’elle est acceptée.':st==='received'?'Cette personne t’a envoyé une demande d’ami.':'Vous n’êtes plus amis. Envoie une demande pour reprendre la discussion.'}</span>${st==='sent'?'':`<button type="button" id="frLockBtn">${st==='received'?'Accepter':'Ajouter'}</button>`}`;
  const bt=$('frLockBtn');if(bt)bt.onclick=()=>friendAction(c);
}
async function frAdd(id){
  const {error}=await sb.rpc('friend_request',{target:id});
  if(error){flash('Impossible d’envoyer la demande.');return false}
  await loadFriends();return true;
}
async function frAnswer(fid,ok){
  const {error}=await sb.rpc('friend_respond',{fid,accept:ok});
  if(error){flash('Action impossible.');return}
  await loadFriends();
}
async function frRemove(id){
  const {error}=await sb.rpc('friend_remove',{other:id});
  if(error){flash('Action impossible.');return}
  await loadFriends();
}
function friendSec(c){
  if(!c.other)return '';
  const st=frState(c.other.id),r=frRow(c.other.id);
  const since=r&&r.accepted_at?new Date(r.accepted_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
  const sub=st==='friends'?`<small class="frok">Amis${since?' depuis le '+esc(since):''}</small>`:st==='sent'?'<small>Demande envoyée</small>':st==='received'?'<small>T’a envoyé une demande</small>':'<small>Pas encore amis</small>';
  const btn=st==='friends'?'<button type="button" class="frrm" id="aFr">Retirer des amis</button>':st==='sent'?'<button type="button" class="frrm soft" id="aFr">Annuler la demande</button>':`<button type="button" class="fradd" id="aFr">${st==='received'?'Accepter la demande':'Ajouter aux amis'}</button>`;
  return `<div class="sec ephsec frsec"><div class="ephr" style="cursor:default"><span class="ephi fri2">${ico('user')}</span><span class="ephx"><b>Amis</b>${sub}</span></div>${btn}${st==='friends'?'<p class="ephh">La discussion est conservée, mais vous ne pourrez plus vous écrire tant que l’un de vous ne renvoie pas une demande.</p>':''}</div>`;
}
async function friendAction(c){
  const id=c.other.id,st=frState(id);
  if(st==='friends'){if(!confirm('Retirer '+c.name+' de tes amis ?'))return;await frRemove(id)}
  else if(st==='sent')await frRemove(id);
  else if(st==='received'){const r=frRow(id);await frAnswer(r.id,true)}
  else await frAdd(id);
}

/* ---------- MISE À JOUR AUTOMATIQUE ---------- */
const APP_VERSION='2026-11-08.66';
let updShown=false;
async function checkUpdate(manual){
  if(location.protocol==='file:')return 'local';
  if(updShown)return 'new';
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)return 'err';
    const {v}=await r.json();
    if(!v||v===APP_VERSION)return 'ok';
    let tried=null;try{tried=sessionStorage.getItem('pm_upd')}catch(e){}
    const go=()=>{try{sessionStorage.setItem('pm_upd',v)}catch(e){}location.replace(location.pathname+'?v='+encodeURIComponent(v))};
    updShown=true;
    if(manual){go();return 'new'}
    // Pas de brouillon en cours et pas déjà tenté : mise à jour automatique
    if(!$('txt').value.trim()&&tried!==v){$('upd').innerHTML='Mise à jour de PolyMess…';$('upd').classList.remove('hidden');setTimeout(go,1200);return 'new'}
    $('upd').innerHTML='<span>Nouvelle version disponible</span><button id="updBtn">Mettre à jour</button>';
    $('upd').classList.remove('hidden');$('updBtn').onclick=go;
    return 'new';
  }catch(e){return 'err'}
}
setInterval(checkUpdate,5*60*1000);
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){checkUpdate();if(Date.now()-hiddenAt>30000)refreshAll();myAway=false;bumpActive();trackMe();resyncPresence();if(S.me&&statusOn())ackAfterTouch();if(S.cur){const c=S.convs.find(x=>x.id===S.cur);if(c&&c.unread)markRead(c.id)}}
  else{hiddenAt=Date.now();if(S.me&&statusOn()){if(pch)pch.untrack();touchSeen()}}
});
addEventListener('online',refreshAll);
addEventListener('pageshow',e=>{if(e.persisted)refreshAll()});
setTimeout(checkUpdate,3000);

let actx=null;
function beep(){try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1175,t+.09);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.26);
}catch(e){}}

function confirmLogout(){
  return new Promise(res=>{
    const d=document.createElement('div');d.id='cfm';
    d.innerHTML=`<div class="cd"><b>Se déconnecter ?</b><p>Tu pourras te reconnecter à tout moment avec ton e-mail.</p><div class="cb"><button type="button" id="cNo">Annuler</button><button type="button" id="cYes" class="rdb">Se déconnecter</button></div></div>`;
    document.body.appendChild(d);
    const done=v=>{d.remove();res(v)};
    $('cNo').onclick=()=>done(false);$('cYes').onclick=()=>done(true);
    d.onclick=e=>{if(e.target===d)done(false)};
  });
}

async function exportData(){
  const me=S.me,out={exporte_le:new Date().toISOString(),compte:{id:me.id,email:S.email,prenom:me.first_name,nom:me.last_name,nom_affiche:me.display_name,couleur:me.color,photo:me.avatar_path||null},date_de_naissance:null,conversations:S.convs.map(c=>({id:c.id,avec:c.name,depuis:c.created_at,sourdine:c.muted,epinglee:c.pinned})),messages_envoyes:[]};
  try{const {data}=await sb.from('profile_private').select('birth_date').eq('id',me.id).maybeSingle();out.date_de_naissance=data?.birth_date||null}catch(e){}
  for(let from=0;from<50000;from+=1000){
    const {data,error}=await sb.from('messages').select(MCOLS).eq('sender_id',me.id).order('created_at',{ascending:true}).range(from,from+999);
    if(error)throw error;
    out.messages_envoyes.push(...(data||[]));
    if(!data||data.length<1000)break;
  }
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),file=new File([blob],'polymess-mes-donnees.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Mes données PolyMess'});return out.messages_envoyes.length}catch(e){if(e.name==='AbortError')return out.messages_envoyes.length}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  return out.messages_envoyes.length;
}

  }else if(k==='report'){

      };
    });

    infoPage('Confidentialité des données',`<div class="legal"><h4>Ce que PolyMess enregistre</h4><p>Ton prénom, ton nom, ta date de naissance (jamais visible par les autres), ton adresse e-mail, ta photo et ta couleur de profil, tes messages et les fichiers que tu envoies, ton statut en ligne et ta dernière connexion (désactivables dans Confidentialité), et un identifiant technique de ton appareil si tu actives les notifications.</p><h4>À quoi ça sert</h4><p>Uniquement à faire fonctionner la messagerie. Aucune publicité, aucune revente de données.</p><h4>Où sont-elles stockées</h4><p>Chez Supabase, sur des serveurs situés en Europe (Paris).</p><h4>Important</h4><p>Les messages ne sont pas chiffrés de bout en bout : ils sont protégés par ton compte et par les règles d’accès de la base, mais l’éditeur de l’appli y a techniquement accès.</p><h4>Tes droits</h4><p>Tu peux télécharger tes données (À propos, Exporter mes données), corriger ton profil (Profil) et supprimer ton compte (Compte, Zone de danger). Pour toute question, utilise « Signaler un problème ».</p></div>`);
  }else if(k==='legal'){
    infoPage('Mentions légales',`<div class="legal"><h4>Éditeur</h4><p>PolyMess est éditée par Julien Lespes.</p><h4>Hébergement</h4><p>Application : GitHub Pages (GitHub, Inc.).<br>Données : Supabase, serveurs en Europe (Paris).</p><h4>Contact</h4><p>Via « Signaler un problème » dans À propos.</p></div>`);
  }else if(k==='export'){

function confirmDelete(run){
  const d=document.createElement('div');d.id='cfm';
  d.innerHTML=`<div class="cd"><b>Supprimer mon compte ?</b><p>Action définitive : ton profil et les messages que tu as envoyés seront supprimés, y compris chez les personnes avec qui tu discutes.</p><label class="fld" style="text-align:left"><span>Tape SUPPRIMER pour confirmer</span><input id="cDel" autocomplete="off" autocapitalize="characters"></label><div id="cdm"></div><div class="cb"><button type="button" id="cNo">Annuler</button><button type="button" id="cYes" class="rdb">Supprimer</button></div></div>`;
  document.body.appendChild(d);
  $('cNo').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};
  $('cYes').onclick=async()=>{
    if($('cDel').value.trim().toUpperCase()!=='SUPPRIMER'){$('cdm').innerHTML='<div class="msg err">Tape SUPPRIMER pour confirmer.</div>';return}

}

      const links=[['info','Aide et contact','help'],['flag','Signaler un problème','report'],['shield','Confidentialité des données','privacy'],['file','Mentions légales','legal'],['download','Exporter mes données','export']];
      b.innerHTML=`<div style="text-align:center;padding:14px 0 18px"><div class="logo" style="margin:0 auto 10px">P</div><b style="font-size:20px">PolyMess</b><div class="hint2">${esc(vtxt)}</div></div>

  let page=isMob()&&tab?tab:null;

/* ---------- MOBILE : navigation, clavier, rafraîchissement, installation ---------- */
let curPM=null;
function pushPM(k){if(innerWidth<=900){history.pushState({pm:k},'');curPM=k}}
function hideMobInfo(){$('app').classList.remove('mobinfo')}
function closeChat(){S.cur=null;$('app').classList.remove('inchat');hideMobInfo();renderAll()}
function showMobInfo(){
  if(innerWidth>900||!S.cur)return;
  renderInfo(S.convs.find(x=>x.id===S.cur));
  $('app').classList.add('mobinfo');pushPM('info');
}
['chAv','chInfo'].forEach(id=>$(id).onclick=showMobInfo);
addEventListener('popstate',()=>{
  const st=history.state?.pm||null,was=curPM;curPM=st;
  // un volet ouvert (menu, réglages…) : le retour le ferme et on reste où on était
  if($('modalHost').firstChild||!$('menu').classList.contains('hidden')){
    $('modalHost').innerHTML='';$('menu').classList.add('hidden');
    if(was){history.pushState({pm:was},'');curPM=was}
    return;
  }
  if(st==='info')return;
  hideMobInfo();
  if(st!=='chat'&&S.cur&&$('app').classList.contains('inchat'))closeChat();
});

// clavier : l'appli suit la zone réellement visible (iPhone notamment)
function fitVV(){
  const v=window.visualViewport;if(!v)return;
  const st=document.documentElement.style;
  st.setProperty('--vvh',v.height+'px');st.setProperty('--vvt',v.offsetTop+'px');
  if(document.activeElement===$('txt')&&S.cur){const m=$('msgs');m.scrollTop=m.scrollHeight}
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitVV);visualViewport.addEventListener('scroll',fitVV);fitVV()}

// messages manqués : on recharge tout au retour dans l'appli
let lastRef=0;
async function refreshAll(){
  if(!S.me||Date.now()-lastRef<4000)return;
  lastRef=Date.now();
  try{
    await Promise.all([loadConvs(),loadFriends(),loadSeen()]);S.convs.forEach(c=>{if(c.other&&!S.frp[c.other.id])S.frp[c.other.id]=c.other});syncPresence();
    if(S.cur){
      const {data}=await sb.from('messages').select(MCOLS).eq('conversation_id',S.cur).order('created_at',{ascending:false}).limit(200);
      if(data)S.msgs[S.cur]=data.reverse();
      await loadReactions(S.cur);
      const c=S.convs.find(x=>x.id===S.cur);if(c&&c.unread&&!document.hidden)markRead(S.cur);
    }
    renderAll();
    if(S.chan&&S.chan.state!=='joined'&&S.chan.state!=='joining')subscribe();
  }catch(e){}
}

// notifications : via le service worker quand c'est possible
async function showNotif(title,body,tag){
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg&&reg.showNotification){await reg.showNotification(title,{body,tag,icon:'icon-192.png?v=3',badge:'badge-96.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png?v=3'})}catch(e){}
}

// Activation des notifications (réglages ou carte d'invitation) : { fatal, msg }
async function enableNotifs(){
  if(!('Notification' in window))return {fatal:true,msg:'Ce navigateur ne gère pas les notifications.'};
  let r=Notification.permission;
  if(r!=='granted')r=await Notification.requestPermission();
  if(r!=='granted')return {fatal:true,msg:'Autorisation refusée : active les notifications pour PolyMess dans les réglages du téléphone ou du navigateur.'};
  prefs.push=false;let msg='';
  if(pushSupported()){
    try{await pushSubscribe();prefs.push=true}
    catch(e){msg='Alertes appli fermée indisponibles ('+(e.message||e)+'). Tu recevras les alertes seulement appli ouverte.'}
  }
  prefs.notif=true;savePrefs();renderInv();
  return {fatal:false,msg};
}
// Carte « Ne rate aucun message » : une fois, puis 7 jours de répit après « Plus tard »
const INV_KEY='pm_inv_until';
function renderInv(){
  const b=$('ntInv');if(!b)return;
  let until=0;try{until=+localStorage.getItem(INV_KEY)||0}catch(e){}
  const iosWeb=isIOS()&&!isStandalone();
  const ok=S.me&&'Notification' in window&&Notification.permission==='default'&&!prefs.notif&&Date.now()>until&&(pushSupported()||iosWeb);
  if(!ok){b.classList.add('hidden');b.innerHTML='';return}
  b.innerHTML=`<button type="button" class="nix" id="niX" aria-label="Fermer">${ico('close')}</button><div class="nib">${ico('bell')}</div><b>Ne rate aucun message</b><div class="nis">${iosWeb?'Sur iPhone, ajoute d’abord PolyMess à l’écran d’accueil pour recevoir les alertes.':'Reçois une alerte à chaque message, même quand l’appli est fermée.'}</div><button type="button" class="nigo" id="niGo">${iosWeb?'Voir comment faire':'Activer les notifications'}</button><button type="button" class="nilat" id="niLater">Plus tard</button><div class="nierr" id="niErr"></div>`;
  b.classList.remove('hidden');
  const later=()=>{try{localStorage.setItem(INV_KEY,String(Date.now()+7*864e5))}catch(e){}renderInv()};
  $('niX').onclick=later;$('niLater').onclick=later;
  $('niGo').onclick=async()=>{
    if(iosWeb){openSettings('notif');return}
    const r=await enableNotifs();
    if(r.fatal){$('niErr').textContent=r.msg;try{localStorage.setItem(INV_KEY,String(Date.now()+7*864e5))}catch(e){}}
  };
}

// Web Push : abonner / désabonner cet appareil
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol.startsWith('http');
const urlB64=s=>{const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const PUSH_REG='pm_push_reg';
async function pushSubscribe(){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  // appareil déjà enregistré pour ce compte depuis moins de 7 jours : rien à renvoyer au serveur
  try{const [u,e,t]=(localStorage.getItem(PUSH_REG)||'').split('|');if(sub&&S.me&&u===S.me.id&&e===sub.endpoint&&Date.now()-Number(t)<7*864e5)return}catch(e){}
  if(!sub){
    const res=await fetch(SB_URL+'/functions/v1/push',{headers:{apikey:SB_KEY}});
    if(!res.ok)throw new Error('serveur injoignable');
    const {key}=await res.json();
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(key)});
  }
  const j=sub.toJSON();
  const {error}=await sb.rpc('register_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent});
  if(error)throw error;
  try{localStorage.setItem(PUSH_REG,[S.me.id,j.endpoint,Date.now()].join('|'))}catch(e){}
}
async function pushUnsubscribe(){
  try{localStorage.removeItem(PUSH_REG)}catch(e){}
  try{
    const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager.getSubscription();
    if(sub){await sb.rpc('unregister_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}
  }catch(e){}
}
// à la déconnexion : l'appareil ne reçoit plus les messages de ce compte
async function pushDetach(){
  try{localStorage.removeItem(PUSH_REG)}catch(e){}
  if(!pushSupported())return;
  const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager.getSubscription();
  if(sub)await sb.rpc('unregister_push',{p_endpoint:sub.endpoint});
}
navigator.serviceWorker?.addEventListener('message',e=>{
  if(!e.data||e.data.type!=='open')return;if(e.data.req){openRequests();return}if(e.data.id){openConv(e.data.id);if(e.data.focus)setTimeout(()=>txt.focus(),300)}});

// installation sur l'écran d'accueil
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});
addEventListener('appinstalled',()=>{installEv=null});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- RECHERCHE : annuler + clavier ---------- */
(()=>{
  const q=$('q'),row=$('qrow'),root=document.documentElement;
  const upd=()=>row.classList.toggle('qon',document.activeElement===q||!!q.value);
  q.addEventListener('focus',upd);q.addEventListener('blur',upd);q.addEventListener('input',upd);
  $('qCancel').onclick=()=>{q.value='';q.dispatchEvent(new Event('input'));q.blur();upd()};
  const kbOn=e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&e.target.closest('.list'))root.classList.add('kb')};
  document.addEventListener('focusin',kbOn);
  document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.closest('.list')))root.classList.remove('kb')},60));
  $('convs').addEventListener('touchmove',()=>{if(document.activeElement===q)q.blur()},{passive:true});
})();

/* ---------- Expiration : compte à rebours ---------- */
setInterval(()=>{
  const c=S.convs.find(x=>x.id===S.cur);
  if(c){const l=S.msgs[c.id]||[];const n=l.filter(m=>!msgGone(m)&&msgLeft(m)<3600000).length,g=l.some(m=>msgGone(m));
    if(g||n!==c._es)renderMsgs(false);
    else document.querySelectorAll('.te[data-x]').forEach(e=>{e.lastChild.textContent='Disparaît dans '+fmtLeft(+e.dataset.x-Date.now())})}
  renderList();
},60000);
setInterval(()=>{
  let gone=false;
  document.querySelectorAll('.pjex[data-t]').forEach(e=>{const l=+e.dataset.t+EXP_MS-Date.now();if(l<=0){gone=true;return}e.querySelector('span').textContent='Expire dans '+fmtLeft(l);e.classList.toggle('soon',l<SOON)});
  if(gone&&S.cur)renderMsgs();
},60000);

/* ---------- INIT ---------- */
(async()=>{
  setAuthMode(false);
  if(REC0){S.rec=true}
  const {data:{session}}=await sb.auth.getSession();
  if(REC0&&session){showRecovery();return}
  if(REC0&&!session){S.rec=false;authMsg('Ce lien a expiré. Redemande un e-mail avec « Mot de passe oublié ? ».','err')}
  if(!session)$('auth').classList.remove('hidden');
})();
